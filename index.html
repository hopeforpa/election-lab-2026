<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Election Lab v2.2 | Hope for PA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#17202B; --muted:#5A6573; --rule:#D6DCE3;
  --dem:#2C5AA0; --rep:#B4433A; --oth:#6F7F8F; --mark:#C4922A; --mark-soft:#F4E8CB;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11161D; --surface:#19202A; --ink:#E6EBF0; --muted:#9AA6B3; --rule:#2B3542;
    --dem:#7096D6; --rep:#E07B71; --oth:#8C9AA8; --mark:#E2B550; --mark-soft:#3A3120;
    color-scheme:dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.cond{font-family:var(--cond)}
h1{font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.015em}
h2{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:600}
h3{font-size:17px;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}
a{color:var(--dem)}
.lede{color:var(--muted);max-width:70ch;margin-bottom:24px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

header.top{position:relative;z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-inner{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.brand{font-family:var(--cond);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand{flex-direction:column;align-items:flex-start;gap:4px;padding:4px 0}
.hfp-logo{height:52px;width:auto;display:block}
.brand-ver{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12.5px;font-weight:400;color:var(--muted)}
.brand-ver b{color:var(--ink);font-weight:600}
.foot{max-width:1180px;margin:0 auto;padding:22px 20px 40px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px}
.foot p{margin:0}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500;text-decoration:none;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);background:var(--mark-soft);box-shadow:inset 0 -2px 0 var(--mark)}

main{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px;margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;min-width:0}
textarea{min-height:110px;resize:vertical;font-size:13px}
.btn{font:inherit;font-weight:500;border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.danger{background:transparent;color:var(--rep);border-color:var(--rep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

.chart-box{position:relative;height:340px}
.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--surface);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--mark-soft)}
.pos{color:var(--dem)} .neg{color:var(--rep)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.tag.prov{border-color:var(--mark);color:var(--ink);background:var(--mark-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

.readout{border-left:3px solid var(--mark);padding:4px 0 4px 14px;margin:16px 0 0;max-width:80ch}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 20px}
.kv div span{display:block;font-size:12.5px;color:var(--muted)}
.kv div b{font-family:var(--cond);font-size:20px;font-weight:600}
.bar-stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0}
.bar-stack div{height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.picker{max-height:260px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px}
.picker label{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
.picker label:last-child{border-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--mark-soft);border:1px solid var(--mark);border-radius:999px;padding:3px 10px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{background:var(--mark-soft);border:1px solid var(--mark);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.back{display:inline-block;margin-bottom:12px;font-size:14px}
.rolegrid{display:grid;grid-template-columns:1fr 200px;gap:8px 14px;align-items:center;max-width:560px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v1.1 plain-language visuals */
/* v1.2 rule: the picture says it boldly; big numbers first, details underneath */
.bignums{display:flex;gap:28px;flex-wrap:wrap;margin:2px 0 12px}
.bignum{font-family:var(--cond);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1;letter-spacing:-.01em}
.bignum .poss,.mbv .poss,.dl .poss{display:block;font-size:.55em;font-weight:600;opacity:.75;margin-top:4px}
.mbv .poss,.dl .poss{font-size:.68em;margin-top:0}
.bignum small{display:block;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.ico{display:inline-flex;width:40px;height:40px;border-radius:10px;background:var(--mark-soft);color:var(--ink);align-items:center;justify-content:center;flex:none}
.card-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.card-head h3{margin:0}
.headline{font-family:var(--cond);font-size:clamp(22px,3vw,30px);line-height:1.25;font-weight:600;max-width:46ch;margin:0 0 10px}
.say{font-size:15px;max-width:60ch;margin:10px 0 0}
.help{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px;font-size:14px}
.help summary{cursor:pointer;color:var(--dem);font-weight:500}
.help p{margin:8px 0 0;max-width:72ch;color:var(--muted)}
.hemi-wrap{text-align:center}
.hemi{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.hemi-cap{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.hemi-cap b{color:var(--ink);font-family:var(--cond);font-size:16px}
.hemi-title{font-size:14px;color:var(--muted);font-weight:500}
.verdict{font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.15;margin-bottom:6px}
.gauge,.ruler{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.mbars{display:grid;gap:2px}
.mb{display:grid;grid-template-columns:44px 1fr 112px;gap:10px;align-items:center;font-size:14px;padding:4px 4px;border-radius:5px}
.mb.hl{background:var(--mark-soft)}
.mb.hl .mby{font-weight:700}
.mbt{display:flex;height:12px;background:var(--paper);border-radius:3px;overflow:hidden}
.mbt i{display:block;height:100%}
.mbt i.maybe{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px)}
.mbt i.gain{background:transparent!important;box-shadow:inset 0 0 0 2px var(--c)}
.mbv{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--cond);font-weight:700;font-size:19px;color:var(--ink)}
.drow{display:grid;grid-template-columns:170px 1fr 130px;gap:14px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule);cursor:pointer}
.drow:hover{background:var(--paper)}
.drow.hl{background:var(--mark-soft)}
.dy b{font-family:var(--cond);font-size:18px;display:block;line-height:1.1}
.dy span{font-size:13px;color:var(--muted)}
.dd{line-height:0}
.pd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin:1.5px}
.pd.gain,.pd.maybe{background:transparent;box-shadow:inset 0 0 0 1.6px var(--c)}
.dl{text-align:right;font-family:var(--cond);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
@media (max-width:700px){.drow{grid-template-columns:1fr}.dl{text-align:left}}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media (max-width:700px){.movers{grid-template-columns:1fr}}
.mover{border:1px solid var(--rule);border-radius:8px;padding:14px}
.mover ol{margin:8px 0 0;padding-left:22px}
.mover li{padding:3px 0;display:flex;justify-content:space-between;gap:10px}
.mover li span:last-child{font-variant-numeric:tabular-nums;font-family:var(--cond);font-weight:700;font-size:19px}
.sheet{border:1px solid var(--rule);border-radius:6px;overflow:hidden;font-size:12.5px;margin:10px 0}
.sheet table th{background:var(--paper)}
.sheet td,.sheet th{padding:5px 8px}
.sheet .colA{background:var(--mark-soft)}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding-right:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gloss .panel{margin:0}
.gloss h3{margin-bottom:6px}
.gloss p{color:var(--muted);margin:0;font-size:14.5px}
/* v1.4 winners analysis and references */
:root{--ok:#2E7D5B}
@media (prefers-color-scheme:dark){:root{--ok:#5DBB8E}}
.tactics{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-bottom:20px}
.tactics .panel{margin:0}
.tactic .bignum{font-size:clamp(32px,4vw,44px);margin:2px 0 10px}
.ex{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.ex li{margin:4px 0}
.evrow{margin-top:12px}
.ev{display:inline-flex;align-items:center;gap:3px;font-size:13px;margin-right:16px}
.ev i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);display:inline-block}
.ev i.on{background:var(--ink)}
.ev b{font-weight:600;margin-left:6px}
.ev-strong i.on{background:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.ev-partial i.on{background:var(--mark);box-shadow:inset 0 0 0 1.5px var(--mark)}
.chk{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chk-ok{background:var(--ok);color:var(--surface)}
.chk-wait{background:var(--mark-soft);border:1px solid var(--mark)}
.chk-open{border:1px solid var(--mark);color:var(--ink)}
.chk-no{border:1px solid var(--rule);color:var(--muted)}
.click-card{cursor:pointer}
.click-card:hover{border-color:var(--mark)}
.reader p{max-width:75ch;margin:0 0 14px;line-height:1.65}
.reader mark{background:var(--mark-soft);color:var(--ink);box-shadow:0 0 0 2px var(--mark-soft)}
/* v1.5 rule: fun and visual, bottom line up front */
.bluf{background:var(--ink);color:var(--surface);border-radius:16px;padding:30px 32px 32px;margin-bottom:16px}
.bluf-kicker{margin:0 0 10px;font-size:15px;opacity:.7}
.bluf-head{font-family:var(--cond);font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1.04;margin:0 0 12px;color:var(--surface);max-width:20ch}
.bluf-sub{margin:0;font-size:clamp(17px,1.8vw,21px);opacity:.85;max-width:52ch}
.mb-avg{border-top:2px dashed var(--rule);margin-top:6px;padding-top:8px}
.mb-avg .mby{font-weight:700}
.mb-avg .mbt i{background:var(--ink);opacity:.75}
.avg-note{font-size:14px;margin:12px 0 0;padding:10px 12px;background:var(--paper);border-radius:8px}
.avg-note b{font-family:var(--cond);font-size:18px}
.headline-row{display:flex;gap:24px;align-items:center;justify-content:space-between}
@media (max-width:760px){.headline-row{flex-direction:column;align-items:flex-start}}
.counting{flex:none;text-align:center}
.counting svg{display:block;overflow:visible}
.counting-cap{font-family:var(--cond);font-weight:700;font-size:20px;margin-top:2px}
.dots i{font-style:normal;animation:blink 1.4s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.15}40%{opacity:1}}
.cnt-box{fill:var(--ink)}
.cnt-slot{fill:var(--ink);opacity:.6}
.cnt-white{fill:#fff}
.cnt-pupil{fill:#17202B;animation:look 2.4s infinite ease-in-out}
.cnt-mouth{fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round}
.cnt-sweat{fill:#7DB7E8;animation:sweat 2.4s infinite ease-in}
.cnt-b rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.cnt-b path{fill:none;stroke:var(--dem);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cnt-b{animation:drop 2.4s infinite ease-in;opacity:0}
.cnt-b.b2{animation-delay:.8s}.cnt-b.b3{animation-delay:1.6s}
.cnt-bubble rect,.cnt-bubble path{fill:var(--mark-soft);stroke:var(--mark);stroke-width:1.5}
.cnt-bubble text{font-size:11px;font-weight:600;fill:var(--ink)}
.cnt-bubble{animation:bob 2.4s infinite ease-in-out}
@keyframes drop{0%{transform:translate(0,-10px) rotate(-12deg);opacity:0}15%{opacity:1}75%{transform:translate(0,92px) rotate(6deg);opacity:1}85%,100%{transform:translate(0,104px) rotate(0);opacity:0}}
@keyframes look{0%,100%{transform:translate(0,-2px)}50%{transform:translate(0,3px)}}
@keyframes sweat{0%,30%{transform:translate(0,0);opacity:0}45%{opacity:1}100%{transform:translate(2px,40px);opacity:0}}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-4px)}}
@media (prefers-reduced-motion:reduce){.cnt-b{opacity:1;animation:none;transform:translate(0,60px)}.cnt-b.b2,.cnt-b.b3{display:none}.cnt-pupil,.cnt-sweat,.cnt-bubble,.dots i{animation:none}.dots i{opacity:1}}
.count-banner{display:flex;align-items:center;gap:28px;background:var(--surface);border:1px solid var(--rule);border-top:8px solid var(--mark);border-radius:14px;padding:16px 26px;margin-bottom:20px}
@media (max-width:760px){.count-banner{flex-direction:column;align-items:flex-start}}
.tosser{width:min(380px,100%);height:auto;flex:none;display:block}
.count-text h2{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4vw,46px);line-height:1.05;margin:0 0 8px}
.count-left{font-family:var(--cond);font-weight:600;font-size:22px;color:var(--mark);margin:0 0 8px}
.ti{fill:var(--ink)}.tp{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.tc{fill:none;stroke:#185FA5;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t-arm,.t-head{transform-box:view-box}
.t-arm{transform-origin:232px 150px;animation:t-arm .9s infinite}
@keyframes t-arm{0%,18%{transform:rotate(4deg);animation-timing-function:cubic-bezier(.5,0,.3,1)}40%,44%{transform:rotate(-150deg);animation-timing-function:ease-in-out}100%{transform:rotate(4deg)}}
.t-hand{animation:t-hand .9s infinite steps(1)}@keyframes t-hand{0%{opacity:1}40%{opacity:0}100%{opacity:0}}
.t-fly{animation:t-fly .9s infinite}
@keyframes t-fly{0%,39.9%{opacity:0;transform:translate(0,0) rotate(0)}40%{opacity:1;transform:translate(0,0) rotate(0);animation-timing-function:ease-out}55%{transform:translate(-46px,-22px) rotate(-90deg);animation-timing-function:ease-in}82%{opacity:1;transform:translate(-86px,152px) rotate(-210deg)}83%,100%{opacity:0;transform:translate(-86px,152px) rotate(-210deg)}}
.t-head{transform-origin:222px 136px;animation:t-head .45s infinite ease-in-out}@keyframes t-head{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-4deg)}}
.t-sweat{fill:#85B7EB;animation:t-sweat 1.2s infinite ease-in}.t-sweat.s2{animation-delay:.6s}
@keyframes t-sweat{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(6px,30px)}}
.t-steam{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;animation:t-rise 2.4s infinite ease-out;opacity:0}.t-steam.s2{animation-delay:1.2s}
@keyframes t-rise{0%{transform:translateY(4px);opacity:0}30%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tosser *{animation:none!important}.t-fly,.t-sweat,.t-steam{opacity:0}}
.thist{width:100%;min-width:520px;height:auto;display:block}
.pgrid{width:100%;max-width:420px;height:auto;display:block;margin-top:8px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
.heat-tile{border-radius:8px;padding:8px 9px;min-height:62px;border:1px solid var(--rule)}
.heat-tile b{display:block;font-family:var(--cond);font-size:24px;line-height:1}
.heat-tile span{display:block;font-size:11.5px;line-height:1.25;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbody > .stamp{display:inline-block;margin-top:4px}
.empty-turn .bignum{font-size:30px;margin-bottom:8px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.board-col{background:var(--surface);border:1px solid var(--rule);border-top:8px solid var(--c);border-radius:14px;padding:16px 18px 12px}
.board-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.board-top b{font-family:var(--cond);font-size:48px;line-height:1;color:var(--c)}
.board-top strong{display:block;font-family:var(--cond);font-size:22px;line-height:1.1}
.board-top span{font-size:13px;color:var(--muted)}
.board-item{display:block;padding:9px 0;border-top:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:17px;font-weight:500}
.board-item:hover{color:var(--c)}
.board-item::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:10px;vertical-align:3px;opacity:.5}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;margin-bottom:22px}
.score > div b{display:block;font-family:var(--cond);font-size:40px;line-height:1}
.score > div span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.score{grid-template-columns:1fr}}
.tactics{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.tcard{background:var(--surface);border:1px solid var(--rule);border-top:8px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:90px}
.tviz{background:color-mix(in srgb,var(--c) 10%,var(--surface));padding:14px 14px 6px}
.viz{width:100%;height:auto;display:block}
.tbody{padding:16px 20px 18px}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.thead h3{font-size:24px;line-height:1.12;font-weight:700;margin:0}
.stamp{flex:none;transform:rotate(-4deg);border:2.5px solid var(--c);color:var(--c);border-radius:8px;padding:4px 9px;text-align:center;line-height:1.1;margin-top:2px}
.stamp b{display:block;font-family:var(--cond);font-size:17px}
.stamp span{font-size:10.5px;font-weight:500}
.stamp-strong{--c:var(--ok)} .stamp-partial{--c:var(--mark)} .stamp-claim{--c:var(--muted)}
.local{flex-direction:row;align-items:stretch;margin-bottom:20px}
.local-num{background:var(--dem);color:#fff;padding:22px 28px;display:flex;flex-direction:column;justify-content:center;min-width:170px}
.local-num b{font-family:var(--cond);font-size:68px;line-height:1}
.local-num span{font-size:13px;opacity:.85}
@media (max-width:600px){.local{flex-direction:column}}
</style>

<script type="application/json" id="ref-mvp-2026">{"id": "mvp-2026-postelection", "title": "Movement Voter Project post-election donor call, Nov 4, 2026", "kind": "Transcript", "date": "2026-11-04", "election": "midterm-2026", "builtin": true, "source": "Uploaded by Kenneth (transcript_1794165003973.txt). Recorded Zoom call hosted by Movement Voter Project for its donors the day after the election.", "reliability": "A celebration and fundraising call by a progressive donor network, recorded the day after the election. Good for learning what organizers say they did. Not reliable on its own for proof that those efforts caused the wins, and its vote counts were unofficial at the time.", "paragraphs": ["Welcome! Welcome! Okay. Can you guys believe we did this? Okay, and first of all, if you haven't looked at the front page of movement.vote yet, you can introduce yourself in the chat. If you haven't looked at the front page of movement.vote, you can invite more people on the front page right now. Okay, so just want to first shout out a whole bunch of our partners, donor community partners, Solidarity and Backline Alliance, Way to Win, WDN Action, Democracy Alliance, PDC, Committee on States, AV, uh SVF, Black Voters Matter. Well, this is movement partners, national partners, Flip the Vote, Ketai, Working Families, Walk the Walk, all our national partners. Please shout out more. Um and just huge huge thank you to all of our donors, all of our volunteers, all of our national partners, local partners, and the incredible MVP staff team doing this together. And yeah, welcome. Yeah, this is going to be so beautiful, so meaningful. We're going to hear from, I think, to over 25 people, and we've extended it to 2 hours. And my co-host Annie Lipsitz, our comms wizard, Annie, we're starting.", "Oh, that's my cue. Sorry.", "Yeah!", "Hi everyone. Um wait. Billy, are you asking me what just happened?", "What just happened, Annie?", "We won! We won! We won! We won so many things! Um yes, like Billy said, my name is Annie Lipsitz. Um I am the MVP donor communications manager. Uh you get many things from me that I write. Um we won. Um I'm going to be the kind of co-host with Billy today. Like he said, we have a pretty long program. We've extended to a full 2 hours. I don't know what time that is. I'm not I don't know what time that is if you're not in the Eastern time zone, but you guys can do that math. We're going to hear from our state advisors from Some of them are with partners. Um, and we did it. So, yes, if you're just joining, welcome. Please put in the chat your name, where you're calling from, what races you're happiest about, and maybe how many hours of sleep did you get last night? I think I got 2 and 1/2. So, we're really powering through um on adrenaline and vibes and joy. Um, so some folks might be new to Movement Voter Project. Really quick, what we are, we like to say we're like a mutual fund for political giving. So, we raise money from all across the country from donors just like you and channel it um towards groups on the ground, many of whom you're going to hear from today in states across the country, um so they can do a local organizing and build movements, win elections, and then get back to the work of organizing advocacy, passing policies that we all need to improve the lives of working class people all across the country.", "Yes.", "I think that's it. I think Oh, oh, a couple I have a couple housekeeping things because I know everybody's going to ask. We are recording this call. We will be sending the recording and the slide deck out um maybe later today, maybe tomorrow because the communications team needs to take a nap. Um, but don't worry, it's all coming. We're going to mute the chat once our program begins. If you've been with us before, you know the drill. We're going to use the Q&A box, which you can find in the Zoom menu bar to ask questions. Um, that's it. Billy, back to Billy.", "Okay, quick plug. If you haven't looked at movement.vote, we have an amazing fancy election tracker, and you can also invite more people to join us to have share this meaningful experience with all of us. So, we said it was going to be the biggest early vote in history. Did we deliver? We delivered. We said the core strategy was to make it too big to rig. Did we deliver? We delivered. And when I I we, I mean the larger we, all of us did this together. We need to be so proud celebrating. Woo! And sleeping. And I also need to say this was despite winning this was the most underfunded election for organizing in recent memory. All the organizations you hear from today were deeply underfunded to do their work and often had to cut a third or half or even 2/3 of their program and they did heroic work anyway and they are all deeply underfunded now going into 20 27. So, please make big plans right now to fund and support these organizations whether it's through MVP or any of our wonderful allied organizations. These organizers are the frontlines. Donors, what's our job? We're the supply line. We won so much, but I also want to acknowledge the heartbreaking losses in Florida, in Louisiana, in Tennessee and protecting trans people and reproductive freedoms. We're not abandoning anyone and also we had some huge wins like you'll hear about in Missouri and like electing the first openly trans legislator in Alabama. Okay, we're going through region by region on this call starting with the South and then we'll come back to the South at the end because everyone wants to hear from South Carolina and Mississippi. Yeah, we're making you wait till the end to hear from South Carolina and Mississippi and we're going to go super fast lightning round 3 minutes per state or region. So, I'm passing it to our Southern Regional Advisor Jillian Johnson to talk about the South. Jillian?", "Thank you, Billy. 3 minutes is crazy. That is not enough time. All right, we're going to do our best. Hey, everybody. Jillian Johnson, um Southern Regional Field Director at MVP. I'm here at the Carolina Federation's office with Kendall Odumino, one of my favorite people in the world. Um Kendall is going to tell us a little bit about um North Carolina in a few minutes. But I'm going to start with a quick overview of the South. Uh in the immortal words of Andre 3000, the South got something to say. And last night, the South really had something to say. Overall, Southern states shifted 20 points to the Democrats compared to 2 years ago. With Mississippi in the lead moving a whopping 23 points to the Dems this year. Um, a couple of notes before I get started. Texas is not in the Southern region. You'll hear about Texas when we go to my colleague Myrna in the West. Um, of course there's really exciting news to report there, so I didn't want anybody to think we were leaving them out. Um, and again, we're going to do a deep dive into North Carolina with Sindolo, um, where we've gone from one vote away from a legislative supermajority to one vote away from a Democratic trifecta in one election cycle. Um, and we'll also be hearing from my colleague Jordan, um, down in Georgia, where among other amazing things our partners helped elect the first black woman governor in US history. Um, but MVP has made unprecedented investments in the South this year in the wake of the Louisiana versus Colay Supreme Court decision, which allowed Republicans to redraw districts across the South that had been previously created under the Voting Rights Act. Republicans were able to destroy those districts that allowed black voters to elect candidates from their communities and instead create maps that broke those districts up into little pieces, combine them with rural areas to dilute their votes. And last night, we saw that strategy backfire spectacularly across the entire region. In Alabama, Florida, and Tennessee, all states that underwent mid-cycle um, mid-cycle redistricting, Democrats retained and flipped congressional seats in absolute defiance of Republicans gerrymandering. We also picked up seats in Virginia, Kentucky, and South Carolina. And all across the South, Democrats have over performed even our most hopeful projections, flipping a Senate seat in South Carolina where Annie Andrews became the first Democrat to be elected to that seat in since 1998. They also, as a side note, broke their legislative supermajority. And in Mississippi, where as of the last time I I online, Democrat Scott Colom is leading by 43 votes with provisionals with provisional ballots still still like remaining to be cast or counted. So, we are watching that race really closely. Our partners in Mississippi one of our partners in Mississippi is going to be on later to talk about that race and we're super super excited to keep supporting those folks. And of course we retain seats in Virginia and Georgia ensuring that the Democrats move into the majority in the Senate by a margin that's large enough to really make a difference. Again, as Billy did I just want to highlight some of the places where we fell short but made incredible gains towards the world that we are fighting for. In Arkansas Chris Jones came within 3,000 votes of winning in US House District 2 which is a district that Trump won by 16 points. In Louisiana Jamie Davis came within two points of winning a Senate seat in a Trump plus 22 state. And in Tennessee Justin Pearson lost his race for Congress by just 2,500 votes in one of the three districts that Republicans split Nashville into to break up the black vote in Nashville. But just next door in another one of those districts we're at time. I'm going to stop. We're going to move to North Carolina.", "Hello. I am so excited to be on this call with y'all. MVP y'all are serious. You have been with us all along the way and I just got to say it is so fantastic to wake up 16 years after the Republican takeover of our state and say we're back. Like to really feel that change and to be like MVP y'all have been with us from the beginning. So, just want to say that very excited. Um As Jillian said, we might get to a majority in both state in the House and in the Senate. Even if we don't do that we just have one. The change that's going to be there for our people at the state level is incredible. I want to talk to you a little bit about organizing. We we were excited about Roy Cooper. It's very important for what's happening for the US Senate. And Anita Earls at the state Supreme Court got nearly as many votes like down ballot. We're talking about a state Supreme Court race. Why did that happen? Because organizing, because of investment in organizing. People are saying this fight is essential to us. So, we're really excited about seeing those results and some of our people on the ground, whether it's Alamance County with our comrades with Down Home North Carolina and Siembra North Carolina, or our people in New Hanover County, or our people in Preside County, flipping county commissions, flipping district attorneys, flipping school boards all over the place are feeling people are feeling this sense of hope cuz we've been holding on for a really long time, y'all. And now it's all coming home. So, just wanted to say thank you. Is there anything else I should say about North Carolina, Julie?", "Um, I will just add yet again, we are seeing the failure of Republican attempts to gerrymander. In North Carolina, we have flipped at least four, at least four US House seats, and it could be as high as six in these gerrymander districts. There are a couple of races where they're still counting the ballots. So, we could go from 10 Republicans and four Democrats in the House to 10 Democrats and four Republicans. It is It is absolutely wild. Um, and the second big story is we flipped 16 seats in the North Carolina House of Representatives taking the majority first time in 16 years. Four seats in the state Senate. We are one seat away from a trifecta, y'all. We are doing it. Um, MVP ouse, you guys. MVP, we invested in that. We flipped our house for the first time in 22 years, which again, black women for the win. We are our representative, our house, excuse me, our house minority leader Carolyn Hugley Hugley Hugley, excuse me, is in line to potentially become the first black woman speaker of the Georgia House. So, we are really, really excited about that. And third, we flipped our public service commission. So, we are now majority Democrat and I'd want to lift up Georgia Conservation Voters for really being at the the head, the leader of this fight since 2019 and just all the other groups who really made this possible. And I'm going to turn it over to Melody who is joining us. She's the ED of Georgia Youth Justice Coalition. They have been building such an intentional, organic, strong base of multi-racial young voters in the state and she has been doing an extraordinary job of training, developing young leaders. And so, I'm going to turn it over to you, Melody, to please take it away.", "Thank you so much, Jordan. Hey y'all, I'm Melody Oliphant. I'm the executive director of the Georgia Youth Justice Coalition. I'm also a two-time Stacy Abrams for governor staffer. So, as many of us in Georgia know, this these wins have been over a decade in the making. Before anything else, I just want to say thank you so much to everyone who invests in MVP, everyone on the MVP team. You should feel so, so proud today. A lot of folks are going to claim credit for last night, but MVP moved money early and strategically to the organizations doing the work and that happened because of the laser sharp work that Jordan has done for Georgia all year and the relationships that MVP has on the ground to know who is really doing the work. So, by investing in GYJC through MVP, you absolutely made the difference in Georgia. I'm going to share what you won't hear on CNN or NBC. Just like Jordan said, in the Georgia State House, Democrats flipped 14 seats and lost two. That's a net gain of 12, breaking our last record of 11 seats gained in 2018. We now hold a 93 seat majority in the Georgia State House for the the time in more than 20 years. And GYJC was the only organization running voter contact across all 16 of the most competitive districts going into this election. And we are not done yet. House District 151 is headed to a December 1 runoff where we could pick up one more seat in the State House. So, at GYJC, we always knew the down ballot races would be close. In 2024, the four closest State House race races were decided by 48, 85, 273, and 621 votes. This year, House District 103 flipped by just 27 votes. In House District 154, we're up by 59 votes after GYJC knocked more than 12,000 doors. And at House District 164, Stephanie Burden, a black woman in Savannah, flipped the seat by more than 1,200 votes after we knocked more than 19,000 doors and made nearly 49,000 calls. And on the Cobb Board of Ed, we flipped District 4 by more than 4,500 votes and took the majority on the Cobb Board of Ed. That is the second largest school district in Georgia. We knocked more than 16,000 doors, made more than 63,000 calls, and sent thousands of pieces of mail. And when vendor delays left absentee voters in Cobb, DeKalb, and Gwinnett without their ballots, we were already texting nearly 40,000 absentee voters to make sure every one of them had a plan to vote because exactly like like Billy said, we needed to make this election too big to rig. Um now the hard part begins. Um and I'll close out by saying MVPs Beyond the Autopsy gets it exactly right. So, you are in good hands with the MVP team. We have to restore faith in the Democratic Party because we still live in a two-party system. That means Democrats governing with the mandate voters just delivered. Um but together, we really just rewrote the narrative on what is possible for the South. And MVP did that in Georgia, in North Carolina, and in places folks thought were unwinnable like South n unique voters, knocked on more than 1 million doors. Um you'll get to hear from some of our partners today, including Lupe in the Valley later on. But now I just want to pass it over to Prianna Brown from Texas Organizing Project, who you all have been hearing from on our end, to tell us a little bit more about what it was like for them and the work that they got to do this cycle to help make this moment possible for Texas.", "Thank you, Myrna. Um you know, I just might cry. Uh you know, where I left this conversation with MVP last time was talking about being a little girl growing up in Lubbock, Texas, and all I wanted to do was change the world. And I thought that Texas has would be a linchpin in that. And I'm still like disoriented by the scale and the magnitude of the work that we did. And I'm very clear that the only way that we, as our comms director has been saying, body slammed this election was because of the infrastructure that has been toiling and grinding and willing this victory to happen. Um I'm reminded of, you know, uh one of our dear organ- dear members that changed how I organized, made me a better organizer, Isaac Henry, used to say he likes throwing down with top because we have a plan and we're working the plan. And that plan has been um that we got to show up in the nine counties that are most populous in Texas. It extended to 16, where the most Black and Latino folks live. And we have to expand the elect- And if we do that enough times, we can win statewide office. We've always understood that we weren't going to we would win statewide office before we flipped the house, right? Because of how gerrymandered how how for real voter suppression here voter suppression here is, and it starts with gerrymandering uh on you know, just a wicked level. So, we talked along with other as as um as Myrna was saying, Texas for all partners have been working this plan around how do we expand the electorate in counties the size of the battleground states. So, ok, nothing happens by accident. You know what I'm saying? Nothing just happens. And we're just very clear that in order for us to get here today, it has taken the blood, sweat, and tears of a amazing fabric of people across this country. And deep appreciation for MVP over the years in believing in us and and fueling our work. Um cuz here we are. We did that", "Thank you so much, Briana. Um as we continue to to go after all the things that we were able to do, I'm going to pass it over to Val to talk a little bit about Arizona.", "Yes. So, more exciting news from the state I love almost as much as Texas, Arizona. So, Arizona is all blue. All blue. You look around, it's blue here, it's blue there. It's all the state wide. It's everywhere you can possibly think. This is huge. This is Some would say, is this a miracle? And what people in Arizona and the infrastructure would say is this is not a miracle. It wasn't a miracle. There was a road map. So, if we think back to 2010, this is the show me your papers time. This is the time when LUCHA is working really hard in Arizona. This is the beginning of horrible things, right? So, there is this super majority that takes place in Arizona 16 years ago. And now 16 years later, we have a super majority of Democrats in Arizona. That didn't just happen overnight. It happened because from those first groups, other groups, MVP was lucky enough to be a part of seeding new groups into the infrastructure in Arizona. Building and growing organizations into larger organizations from urban cores to rural areas and bringing them all together into this infrastructure and then that continued year after year. So, with this you might think, what is everybody doing 3 weeks before the election? 3 weeks before this election that infrastructure was together. They were together strong. They had over a thousand members come together across the state to prepare for this moment. That's called strategic organizing. They came together. They created a people's agenda. This is groups like Lucha, O V O V, Chispa, Rasa, AANHPI for equity, the Arizona Students Association, all coming together to build for this moment, for this win. Not to just deliver a win, but to deliver the opportunity. The opportunity for what this means for so many communities in Arizona to be able to walk through this. So, we say no excuses. There are no excuses now. It is time to deliver. It is time to have the conversations about what these groups can do. Groups that have been put through the ringer over these last several years. Been told that their strategies were wrong, that the way that they did it was wrong, but we knew they were right because they trusted their gut, because they know their communities and they know how to bring it to the finish line. And that's what's up next. All right, I am passing it over.", "Oh man, the South showed up. The Southwest showed up. And you know who else showed up last night? The Midwest. The Midwest showed up. And I'm just going to talk really quickly. We're going to We're going to hear from Michigan, Ohio, Wisconsin, and Iowa. But first, I'm just going to give a quick shout-out to Minnesota that had a huge sweep, has their trifecta back. People were putting their I voted early stickers on the Alex Preda Memorial and bringing the spirit of fighting back to this election. Also, huge unexpected wins in Indiana, in Missouri, where people beat back an anti-trans and reproductive ballot measure in Missouri. Shout out to PROMO. But, I'm going to bring on I know there's a state that's gotten a lot of attention recently. Um I think it's called Michigan. Jameela, Brandon.", "Brandon.", "Tell us about Michigan. What happened in Michigan?", "Hi there. Hi, I'm Jameela. [clears throat] I'm the state advisor for Michigan and", "What up, though? I'm Brandon Snyder, state director for the Michigan Working Families Party.", "All right. So, um I'm not going to go through all of the like elections. You guys can Google that. Um but, we obviously we won the Senate race, which is amazing. And one thing I just I want to highlight about that Senate race cuz I think um I think it did come through in the national media is that the right has for the past three cycles here really at least been done a really good job of um exploiting the internal tensions, the tensions among and between the communities that MVP partners organize, whether they are Muslim folks, black Michiganders, immigrants, LGBTQ folks. That has been their go-to divide and conquer tactic, and it has worked, and it has been really hard and painful um for our partners, for the people they organize, um cycle after cycle. And this year was if not the worst, it was it was really bad. And it was really bad um in the Senate race in particular. And our partners did not shy away from the hard, grueling conversations that people had to have with their members to get them past the politics of division to a bigger we, to you know, the Michigan that we want to be that is a multi-racial democracy for everybody. And it was hard. And we had Jewish organizers having hard conversations with members of their community. We had Muslim organizers talking about, you know, the we had folks talking to Shia members of their community. We had people talking with Hindu members of their community. We had black foot like there was a lot of work that had to be done. And all MBB partners took it on, um, did that work, and were able to bring their community members through. And you see that in in the election turnout. You see it in the votes, um, in a way that I'm really proud of. Um, so that's something I just I want to highlight. Um, the other thing I want to highlight is that we, um, won Michiganers for money out of politics, which is a ballot initiative to get corporate money, um, out of our elections, especially utilities and government contractors like Blue Cross Blue Shield. It won with 81% of the vote. Um, and we are now going to be in court litigating that. And so we're going to keep, um, staying as a supporter of that initiative because it is winning it is absolutely critical to our ability to our ability to deliver for people. Um, and to that end I'm going to pass it to Brandon to talk about our plan to deliver.", "All right, thanks so much. So the Working Families Party here in Michigan has been in existence for the last 18 months. Um, I took this role in, uh, February March of last year. And what we've been doing is working to build a durable multi-racial working class coalition that, uh, stretches from the southwest side of Detroit all the way up to the Keweenaw Peninsula in northern Michigan. And the goal of that coalition is one to be able to win on our policy, but also be able to fight back against the money in our politics. So, how we did that in this election, you know, you've seen it on the New York Times, you've seen it in the media about us winning at the top of the ticket for you know, our governor, our uh you know, our senators as well as our congress folks. But one of the things that we did down ballot in our state house races was that we recruited and supported candidates who come from our communities, who come from our movements and who were able to talk about the things that matter to their their respective communities, but also a broader message of affordability, a broader message of money out of politics, and a broader message of standing up and fighting back against tech and corporations. You see that message of money out of politics, well, if you zoom in a little bit, you know, one of the things that brought this this this message home and stretched all across Michigan again from wherever you stood was people hate our utility companies. People hate DTE Energy, which is one of the corporate monopolies. And being able to talk about accountability on these folks who have raised our rates, who have you know, who suck up all of the energy for the data centers, you know, we're able to bring people together across racial and religious lines over these last few months. The other thing that we're that we're doing as we're talking about how do we build and how do we win is celebrating our collective power while pushing back against the hate. So, Jamila brought up the fact that so much of the right's strategy was to pick and pit each other against each other against each other, pit each other against our neighbors using text messages, using a number of digital ads, spending upwards and upwards of millions of hundreds of millions of dollars on digital to to to sow fear. One of the things that we did we believe in across our coalition was just having people talk to each other, neighbor to neighbor, friend to friend about what matters and what's important. How do we and how do we create a vision of Michigan that's for the many instead of the wealthy and well-connected. Finally, one of the ways that we now that we've got this win, we've got uh over 60 house uh Democratic house members, we got 23 in the Senate, we've regained our trifecta. We've got This is so second time in a generation that we've been able to have a trifecta. We won at the top of the ticket, we won our ballot initiatives, we defeated a constitutional convention, and we've got more and more work that's happened down ballot at the school board municipal level where we've got wins for working-class champions. One of the ways that we are going to do this and we're going to deliver is by being able to push our candidates who were we got across the finish line to be able to deliver one, the affordability agenda. We're going to make sure that those folks deliver and be able to pass the things that people care about and that we sent them to Lansing to do. That was one of the things that we weren't able to do in the last trifecta. But in this trifecta, one of the ways that we want to be different about it is one, doing some of the internal organizing to make sure that these people are working with each other as well as working with our MVP partners and our WFP partners, as well as making sure that we're telling our community about what happens and how they're delivering. So, making sure that we're doing that outward communication so that they at least hear about it three times over the next few weeks and over the next few months so that they know that their vote means something, that they know it's about what the power of what what's their collective power.", "Yes, Michigan. It's and I just want to give a super shout-out to Working Families nationally. Such an incredible organization, incredible partner um that we're so honored to partner with in so many places. Yeah, give love to Working Families Party. Okay, now we're going to bring in the state of Ohio which was written off. Do we have Molly and Misha here? Molly, you did it.", "We did it.", "Oh my god. Misha runs the Ohio Progressive Collaborative, Molly runs the Ohio Organizing Campaign and Ohio Stands Up. Um Misha, why don't you start us off with the overview? And by the way, I told them 2 minutes, so this is totally unfair, but go ahead.", "Okay, we'll try to be we'll try to be fast. Um thank you so much. Uh but this is wild. Okay, um thank you so much for having us uh to the MVP team. Um it is like a historic uh a historic day here. Uh historic wins in Ohio. Um in this 2026 election, it's a huge shift in our political landscape. Um we've won the governor's race, the US Senate race, nearly our entire statewide ticket. We still have some races that are too close to call. Um we broke the Ohio House supermajority. We are entering a new governing environment like I don't know nothing Molly and I have experienced in our careers. So, um of our 15 congressional seats, despite gerrymandering and voter suppression, we are going to be sending eight Dem members to DC. Um so, at the donor table and with our partners like Molly and the OOC, one of our central premise of our strategic framework is that meaningful political change requires sustained and coordinated investment across cycles. So, we have been working on this since 2018. Our approach is centered on organizing, focusing um on really changing these systems, and strengthening this broader ecosystem of organizations, and working across Ohio, which helped us really focus and create the conditions for this year. And so, um this is really a celebration beyond these candidates, and um a celebration for what this means for the organizations, and the power um that these organizations have been building for communities. Um And so, uh we are are really excited for the opportunities ahead of us. Um and uh so, in um one thing that was very unique this cycle is that coming off of 2024, we really looked for um candidates that had not run before, people that um were not the traditional candidates. And we saw that up and down the ticket from uh the top of the ticket with Dr. Amy Acton um through our the the new congressional delegation going to DC um and uh to our local candidates. And I think that that was something that was very uh unique and spoke to uh it spoke to the voters of Ohio, but also is an interesting um way to um have like good coordination, legal coordination, but a a good overlap with our organizing work. Um so uh I also want to just add that some things that are historic about these wins, Ohio's electing our first Democratic uh governor in 20 years, our first woman governor ever, returning Sherrod Brown to the Senate uh to the Senate, and we are electing um a secretary of state, and that impacts voting rights, oversees elections, of course important for our upcoming presidential election, but also can has the controlling vote on the ballot board, which impacts our ballot strategy um for ballot measures, which is a tool that we can use to keep building power for our communities and pass meaningful policy reforms, which is where we are headed next year as we continue to work on an ambitious ballot initiatives and governing agenda in 2027 and beyond um because we keep talking about how to um like we want to think about redistricting, how to hold politicians accountable um where they've not been held accountable prior to this election in at least over a decade. Um so with that kind of summary, I want to hand it over to Molly, um one of our uh you know, ride or die partners, um and we've been in this work for quite quite some time now.", "Thank you, Misha. Thank you, Billy. Um, it's such an honor to be here. My name is Molly Shack. Uh, Billy has been supporting me and my leadership since I was a college student. I was a volunteer on my campus fighting, um, and 15 years later, I now run the organization that helped give space for us. Billy helped fund the organization that gave space to us, um, and we just flipped our state. A lot of people didn't think that we could. Um, for those of you who don't know, our organization faced a ton of challenges this year. We were, um, sorry, I'm getting emotional.", "Take your time.", "In January, we were raided by the FBI. My, uh, 72-year-old mom and my 6-month-old baby answered the front door to two FBI agents trying to come in my house. And 120 agents spread out across the state at the homes of our staff, volunteers, partners, contractors. And literally, Misha and Billy and all of you who may not totally fully understand what your support meant, meant that we were not forced to stay in a in a position of cowering and shrinking when other people stepped back. You all stepped up. And just to give you a sense of what we did, we knocked on 240,000 doors. Sherrod Brown won by 223,000 votes. We decided that them opening up an investigation wasn't going to be the reason that we shut down our doors. And without partners stepping up and saying that we were not going to be afraid, we were not going to stop, they want us off of the field. That is the point. The investigation is the punishment. And the fact that we were able to get back out there and talk to people, the call I was on right before this was with our members, our board, our staff. And to to talk about what the last like 20 years of organizing has meant when people didn't believe in us. The thing is the and this the reason the strategy that MVP is invested in is so important is no state is a flyover state. Every state has people that we're fighting for. And if we want a country that can govern in a way that actually puts human dignity at the center, where like things that people care about, regular things, being able to pay your rent, buy groceries, pay for child care, live in a safe neighborhood, lots and lots of people want those things. People who have been told lots of things about both parties and who don't believe that either party is a pathway to deliver that. And all of our members, for so many of them, they brought new voters to the polls for the first time ever. They volunteered for the first time. They knocked a door for the first time. And what we do that's different about what candidates campaigns do and why your investments matter so much is typically the the biggest act of service that a volunteer can do for a candidate campaign is like knock a door, give money. Which are great things. We need to do those things. But the work that we do 365 days a year means that today our folks are dreaming about what's possible with Amy Acton in the governor's mansion. Being able to think about what a child care agenda could look like if we have child care providers deciding and sitting on the boards that set the regulations. Or if we have teachers and parents helping to set what our public schools look like. Like we're not by any means under an illusion that our fight stops. Like we pick up and fight tomorrow. This is 365 day a year work. But we have a long-term vision that's about two core things are path to power in Ohio. One is we have to unrig the rules of our democracy so that we have a fair fight. And we have to build enough power to win when we have a fair fight. And that is true for this whole country. We will not win just by flipping seats. We win by having power that's centered in regular people fighting for things they care about. And I'm just so grateful for all of you for your support, for helping make that possible literally, figuratively, and every possible way. Without the two of you, Misha and Billy, figuring out how to help make sure that we could continue to do our work, I I literally don't think Ohio would be where we are. So, I'm just so grateful for your support, for your partnership, for your belief in regular people in Ohio and being able to change the world cuz I think we just did it.", "Aliya Molly, we are so proud of you and so grateful for you, and everyone in this call, we have to be there for all these brilliant organizers after the election when everyone goes away in 2027. Everyone else is going to go away. We're going to have to not go away. So, that is that is our work, and I'm going to pass it to Rima, our Wisconsin state advisor, to talk about Wisconsin.", "Yes, hello everyone. Um that was so moving, and um really is an example of why we're all here. Um I'm Rima Ahmed. I'm a Wisconsin state advisor, and some of what you've heard from my neighbors in the Midwest have been the politics of division, and we're familiar with that out here in Wisconsin. We're used to being a Republican laboratory, but yesterday Oh my gosh, yesterday for the first time in 16 years, we now have we've elected a Democratic trifecta. So, we held on to our governor's seat, we flipped the state Senate, flipped the state Assembly, and um we beat the money, y'all. Like, we showed that Wisconsin is not for sale. Literally, there were three Republican billionaires that were funding the Republican party and races up and down the ballot, we beat them. And I know y'all are used to elections being super duper close in Wisconsin. Not yesterday. Um yesterday, like the governor um our our newly um elected uh governor David Crowley won by eight points. We flipped two congressional seats. I'm not going to lie, I really thought we only could flip the you know CD3 in western Wisconsin. I live in CD1 and as much as we've been organizing wasn't sure it was going to happen. We flipped both. By CD1 is by uh by four points, CD CD3 by seven points. Y'all, we are out here. Um, uh you know if you've if you've heard me on calls in years past cuz I've I've been with MVP for a minute now. I used to say it took 10 years of Republican meddling, of being a far a laboratory for the far right to get us to a point where we elected a Republican president for the first time in my lifetime back and I said it will take at least 10 years of investment from folks on this call, from folks near and far all all across the country into our progressive movement to change that. And here we are. So, I am just so psyched. I'm joined here by Christine Neumann Ortiz, executive director of Voces de la Frontera Action in their incredible office with the backdrop of 20 plus years of uh May Day rally t-shirts um to share a little bit about how we got here. How do we deliver this?", "Oh, thank you so much, Rima. Thank you all for the opportunity to be here to celebrate uh together and really reflect on what's next. And uh and yeah, I just really want to give a shout out as well to Movement Voter Project because we share all of us uh the organizations that you support, the donors, the organ- the staff, you know, everyone that's part of it. We understand how change is made and where the power uh to make that change is centered and how we're going to make something that keeps building uh to the kind of society we want to live in. And so, thank you first and foremost for that. Um a key part for Voces de la Frontera Political Fund uh has always been uh that this entity was created to be able to communicate clearly in our case, especially with the Latina community. coming from such a swing state where the margins are so narrow in dif nate seat. She's like, \"Are you voting for Troy Jackson?\" She was like, \"No.\" And I And which is interesting. That's not really how a lot of people have been going. Um and I asked her why and she said looking at me like she sort of I'd I'd understand. She was like, \"Well, why would you ever try to take a woman out of power?\" Um speaking of to Susan Collins. Obviously, a candidate who has done more to make it challenging to be a woman or any gender in America um and in many ways. So, we had actually quite a long conversation. Myself, this new volunteer, and this woman. We talked to her for a long time and we really connected um connected with her and I actually asked her partway through cuz she had started with, \"Tell me about Troy Jackson.\" And so, I started to tell her about Troy Jackson and how I've known him for a long time. I've I've known him since I was little. Like he's been in Maine for so long. I have his cell phone number. He knows my name. Like I was like, \"Troy Jackson like's a real one. Like here's some of the stuff he's done for Mainers.\" Um walked her through it. And afterwards this long conversation, she um I asked her if she had seen any ads, right? There's been hundreds of millions maybe almost a hundred million dollars or something they projected would be spent in Maine on this on the Senate race and there's been incredible ads and attack ads back and forth. She actually said like, \"Yeah, she's seen attack ads as much as anyone else, but none of that matters. She's waiting to be told how to vote.\" Um and that felt like just anecdotally on the doors, that was similar moments like that we heard throughout our volunteers um that actually the value of canvassing is not dead. There is real value to talking to people at the doors and we were able to flip that door and I kept making the joke that if Troy Jackson won by one vote that was my door. That was my door. Um, but making sure that uh we're both we both got more volunteers engaged. We also had more conversations in the doors than ever before um and in person. So it was a really really exciting year for us.", "Guys finally did it.", "Yes, we did it. There you go.", "Oh my god. You did it. You finally did it. Um and now we're going to talk about a state that this is the first election that nobody cares about Pennsylvania. Like cuz there's so many other things, but people are going to care a lot about it in 2028 and it appears Nirav um Sanghani that uh you actually might have won some things that no one's paying attention to.", "We did win some things. And you know what? I got to tell you it's kind of nice that not a lot of people are paying as much attention to Pennsylvania. I feel like it was a little bit of a a little bit of a relief. Although we still felt the pressure. Um Hi everybody, Nirav Sanghani. I'm the Pennsylvania state advisor. Um Really exciting night. We won everything. Just like everywhere. We won everything. Um Now when I say this, I don't mean that we won every election. We didn't win every race. But what we did do was we built infrastructure in places where we didn't win so that we are going to win next time. And I think that's a really important point is we did win big, but we also won in a lot of places across the state where we really needed to see to build some infrastructure, to really seed the ground and plant some roots and really get our partners a foothold in organizing in Pennsylvania. In certain parts of Pennsylvania like old industrial towns, western PA, Altoona, rural parts. But to say that, we also did just win. We just won big, right? Um we expanded our house footprint. Um we now have 111 Democrats in our house. We uh picked up 10 seats last night. Massive win there. Uh and we won our state Senate. Uh we picked up the four targeted seats that we were looking at our state Senate, which means that we now have the trifecta in Pennsylvania. Woo!", "We won the trifecta!", "We won the trifecta! So, our next step is now to build an actual governing agenda. But that's for later. We'll worry about that tomorrow. What's We're going to try to get some really good sleep tonight. But we're really excited because our partners did such incredible work on the ground. We had groups like Make the Road and Working Families Party out in Pennsylvania 7, um where we blew it out of the water. We had Action Together New PA and Make the Road in Pennsylvania 8. We had CASA and One PA in Pennsylvania 10 and Pennsylvania 1. Um and I know Steve's here with me and he's He'll talk a little bit about Pennsylvania 1, but what was really interesting was that the places that we were that we wanted to win we won. And then the places that we thought we weren't going to win, we also still won. So, this is the This is a testament to the incredible work that our partners did on the ground in all of these places. And they have spent years building up an anti-billionaire messaging, especially with our homegrown uh MAGA billionaire, Jeffrey Yass, who was one of the largest political contributors to to MAGA candidates in the country this year. Um And what we told him last night was pound dirt, dude. You're not going to buy our elections anymore. Like this is The people came out. The people voted. The people made their decision that this is their state and they're going to have a voice in it. Um I don't want to jump too much into the numbers. I want to let Steve Paul, who's the executive director with One Pennsylvania, um talk a little bit about the work that they did and some of the ecosystem work that happened in the state. And also, funny enough, I'm actually in Steve's office and he's apparently in the woods somewhere. So,", "[laughter]", "I I need I needed to be with nature, man. I I've been stuck in a in a war room for like 3 days. So, uh appreciate that. Uh hi y'all. Um Steve Paul, I'm the executive director of One PA. Really, really, really excited to be here with y'all. Um I'm in this beautiful Northwest. It's a library, actually. This has like like a huge acre of of land. Um", "We're short on time, so dive in.", "So, one thing I Yeah, I guess I'll get into it quickly. So, I think like Nora said, we we did some exciting things last night. We flipped a couple of seats. Not only did we win all four congressional races. One thing I'll say is like, you know, we flipped CDs 10, 7, 8, and 1 in Bucks County, which 1PA was sort of the field margins for. I will say Bucks County was sort of a top priority race for folks, but we didn't It was a toss-up. Folks thought it was a long shot. We beat Fitzpatrick by five points, which was insane. Um so, it like Nora said, we expanded the the the house majority and we flipped the Senate. I will say like for in terms of folks like in terms of like the meaning of this moment of getting this trifecta, there's so many things we want to do, right? Like increase the minimum wage, which should have been done. I I've been in this work for 10 years and I think for 1PA was founded as part of the fight for 15 and fight for fair economy. So, as an organization, raising the minimum wage is literally in our DNA. So, we finally get to do that and during our sweet 16 as an organization. So, that's actually incredible. The other thing I'll say is like, you know, you know, the the governor, folks are already starting to talk about what their agenda is going to be. One including how we can change the Pennsylvania Constitution to protect folks in this moment, which is a really, really hard thing to do cuz you need to pass things out of the Senate and the house two consecutive sessions to get something on the ballot to change the Pennsylvania Constitution. So, that is a significant thing that we're going to be able to do because we were able to capture both chambers of the General Assembly. And then the last thing I'll say is like, I don't think this would have been possible like I would just piggyback on what everybody else said. This would not have been possible without the deep investment that MVP has put into all the orgs, right? We ran candidates up and down the ballot all across the state to make the case for folks of why we needed this trifecta and we didn't win a lot of them, but I think the one thing I'll I'll notice is I'll say that like on the ground, people were very clearly like against data centers. People were very clearly like the affordability crisis was not something that they they didn't want to continue to live through and our immigrant brothers and sisters deserve dignity in this moment. And so I think the next thing I mean, you know, I I I incredibly appreciate all the support and I think we're in a governing moment right now. I will leave you with this is that it's going to be incredibly important we deliver on those things that people were frustrated by and I think the set of organizations that you all are support are going to come together to actually plan what our vision is and to hold this new trifecta accountable to what the people want in this moment. So, thank you again for all of the work and you know, and and all of the support of the work that you all have done over the last couple years and looking forward to yeah, the delivering for folks in PA.", "You guys did it. Oh my god, the impossible. And now we're going to move to the west bringing back on Mina Ross Camp.", "Hi everyone. I'm back um because Texas wasn't enough. JK, always going to be enough. Um but going to talk a little bit about the western states and as I said during our last briefing that there's nothing plain about them and um so much happened um in the west from Nevada to Nebraska to Colorado, Utah, Montana, California. We were able to pick up and flip incredible seats through the work of some amazing partners on the ground. I'm still so excited to know um that Randy Viagas is now um going to be in the Congress for California 22, um that we were able to elect Sam Forstag in Montana 20 in Montana 1, um that we picked up a seat in Utah, um that there was a flip in Colorado 8 and that we were able to defeat a constitutional amendment to require police um DHS collaboration. And it's really exciting to be able to just see everything that's happened. Um as many of you know, I grew up in the Midwest um in Kansas City to be uh exact and I'm so excited that we also get to talk about Kansas. Um and the fact that the state also um has a Democratic governor and I'm really really excited to be able um to bring on one of our partners um from the state, Davis Hammett, who helps lead Loud Light Action Civic Action, which is partnered and mobilizes and engages young people throughout the state to tell us a little bit of more about their work, what's it feeling like in Kansas after that incredible win. Davis.", "Hey, thank you all. Thank you all so much for having me. It is obviously a very exciting moment in Kansas. And I'm a little bit recovering from all the excitement from last night that went till I think 3:00 a.m. Um So, I'm sure everyone saw what happened in the United States Senate, which was a shocker to I think everyone except for people that live in Kansas. We've always known that this is the real Kansas, what it looks like whenever people actually get to show up, get to vote. Um Some things I do want to point out that you might not hear about that might not get coverage is some things that happen underneath the surface, and particularly in the western part of Kansas. You know, a month ago we had ICE raids across our state in places like Ford and Finney, where Dodge City and Garden City are, which are the major meat packing plants of the country. Um these are majority minority communities that have been really strategically voter suppressed for over a century. And we saw huge turnout there and huge shifts in voter outcome. If you look at the maps of counties for, you know, for the governor's election, for the United States Senate election, you're going to see in the western part of the state
