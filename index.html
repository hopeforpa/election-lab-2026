function headToHead(sel){
  const mts = sel.filter(e => e.type==='Midterm' && e.metrics && e.metrics.houseDefend).sort((a,b)=>a.year-b.year);
  if (mts.length < 2) return '';
  const last = mts[mts.length-1], lc = change(last,'house');
  const lines = mts.slice(0,-1).map(e => { const c = change(e,'house'); if (!c || c.v == null || !lc) return '';
    const lo = lc.v != null ? lc.v : lc.lo, hi = lc.v != null ? lc.v : lc.hi;
    if (hi < c.v) return `<li>${last.year} was worse for the president’s party than ${e.year} (${e.year}: ${c.v < 0 ? 'lost '+(-c.v) : c.v > 0 ? 'gained '+c.v : 'no change'}).</li>`;
    if (lo > c.v) return `<li>${last.year} was milder for the president’s party than ${e.year} (${e.year}: lost ${-c.v}).</li>`;
    return `<li>${last.year} is in the same range as ${e.year} (${e.year}: lost ${-c.v}); the final count will decide which was worse.</li>`; }).join('');
  return `<section class="panel">
    <div class="card-head">${icon('arrows')}<h2 style="margin:0">Head to head</h2></div>
    <div class="grid2">
      <div><h3>House seats won or lost</h3>${miniBars(mts,'house',last.year)}</div>
      <div><h3>Senate seats won or lost</h3>${miniBars(mts,'senate',last.year)}</div>
    </div>
    ${lines ? `<ul class="say" style="padding-left:20px">${lines}</ul>` : ''}
    ${helpBox('Bars show how many seats the president’s party won or lost in each midterm. Blue bars mean a Democrat was president, red a Republican. Striped sections are races still being counted. Outlined bars are gains.')}
  </section>`;
}
let swingRows = [];
function computeSwing(){
  const A = byId(CMP.base), B = byId(CMP.comp), m = CMP.measure;
  const mapB = new Map(B.results.rows.map(r => [norm(r.unit), r]));
  const rows = [], missA = [];
  A.results.rows.forEach(r => {
    const rb = mapB.get(norm(r.unit));
    if (!rb){ missA.push(r.unit); return; }
    const ta = tally(r.values, A.results.columns), tb = tally(rb.values, B.results.columns);
    const a = ta[m], b = tb[m];
    if (a == null || b == null) return;
    const d = m === 'tot' ? (a ? (b-a)/a*100 : null) : b - a;
    if (d == null) return;
    rows.push({unit:r.unit, a, b, d});
  });
  const matchedB = new Set(rows.map(r => norm(r.unit)));
  const missB = B.results.rows.filter(r => !matchedB.has(norm(r.unit)) && !A.results.rows.some(x => norm(x.unit) === norm(r.unit))).map(r => r.unit);
  rows.sort((x,y) => y.d - x.d);
  return {A, B, rows, missA, missB};
}
function swingSection(withRes){
  if (!CMP.base || !CMP.comp) return '';
  const {A, B, rows, missA, missB} = computeSwing();
  swingRows = rows;
  const m = MEASURES[CMP.measure], sa = summarize(A), sb = summarize(B);
  const dp = CMP.measure === 'tot' ? 0 : 1;
  const overall = (sa[CMP.measure] != null && sb[CMP.measure] != null) ? (CMP.measure==='tot' ? (sb.tot-sa.tot)/sa.tot*100 : sb[CMP.measure]-sa[CMP.measure]) : null;
  const ds = rows.map(r => r.d);
  const up = ds.filter(d => d > 0).length;
  const fmtVal = v => CMP.measure === 'tot' ? fmt(v) : (CMP.measure==='margin' ? signed(v,1) : v.toFixed(1)+'%');
  const dUnit = m.unit === '%' ? '%' : ' pts';
  const opt = (id) => withRes.map(e => `<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)}</option>`).join('');
  return `<section class="panel">
    <div class="card-head">${icon('arrows')}<div><h2 style="margin:0">Where did voters move?</h2><p class="small muted" style="margin:0">Places are matched by name, ignoring capitals and extra spaces.</p></div></div>
    ${helpBox('Pick an earlier election in “From” and a later one in “To”. For each precinct or county found in both, Election Lab shows how much it moved. With a Democratic-share measure, a positive number means that place moved toward Democrats and a negative number means it moved toward Republicans. “Points” are the plain difference between two percentages.', 'How to read this')}
    <div class="controls">
      <label class="field">From<select id="sBase">${opt(CMP.base)}</select></label>
      <label class="field">To<select id="sComp">${opt(CMP.comp)}</select></label>
      <label class="field">Measure<select id="sMeas">${Object.entries(MEASURES).map(([k,v])=>`<option value="${k}" ${k===CMP.measure?'selected':''}>${v.label}</option>`).join('')}</select></label>
    </div>
    ${CMP.base === CMP.comp ? '<div class="notice">Choose two different elections.</div>' : `
    <div class="kv" style="margin-bottom:16px">
      <div><span>Overall change</span><b>${signed(overall,1)}${dUnit}</b></div>
      <div><span>Median place</span><b>${signed(median(ds),1)}${dUnit}</b></div>
      <div><span>Places that went up</span><b>${up} of ${rows.length}</b></div>
      <div><span>Places not matched</span><b>${missA.length + missB.length}</b></div>
    </div>
    ${missA.length + missB.length ? `<p class="small muted">Not matched: ${esc(missA.concat(missB).slice(0,12).join(', '))}${missA.length+missB.length>12?', and more':''}. Make the names identical in both files to include them.</p>` : ''}
    ${rows.length ? moversHTML(rows, dUnit) : ''}
    ${rows.length ? `<h3>Every place, from biggest gain to biggest drop</h3><div class="chart-box" style="height:${Math.min(Math.max(260, rows.length*18), 1400)}px"><canvas id="cSwing"></canvas></div>
    <div class="tbl-wrap" style="margin-top:16px"><table><thead><tr><th>Place</th><th class="r">${esc(A.name)}</th><th class="r">${esc(B.name)}</th><th class="r">Change</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.unit)}</td><td class="r">${fmtVal(r.a)}</td><td class="r">${fmtVal(r.b)}</td><td class="r ${['dTwo','dShare','margin'].includes(CMP.measure) ? (r.d>0?'pos':r.d<0?'neg':'') : ''}">${signed(r.d,dp===0?1:1)}${dUnit}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">No places matched between these two elections, or the measure needs data they don’t have (turnout needs a registered-voters column).</div>'}`}
  </section>`;
}
function moversHTML(rows, dUnit){
  const partisan = ['dTwo','dShare','margin'].includes(CMP.measure);
  const up = rows.filter(r => r.d > 0).slice(0,5), down = rows.filter(r => r.d < 0).slice(-5).reverse();
  const li = arr => arr.length ? `<ol>${arr.map(r => `<li><span>${esc(r.unit)}</span><span>${signed(r.d,1)}${dUnit}</span></li>`).join('')}</ol>` : '<p class="small muted">None</p>';
  return `<div class="movers">
    <div class="mover" style="border-top:3px solid ${partisan ? 'var(--dem)' : 'var(--mark)'}"><b>${partisan ? 'Moved most toward Democrats' : 'Biggest increases'}</b>${li(up)}</div>
    <div class="mover" style="border-top:3px solid ${partisan ? 'var(--rep)' : 'var(--muted)'}"><b>${partisan ? 'Moved most toward Republicans' : 'Biggest drops'}</b>${li(down)}</div>
  </div>`;
}
function drawSwing(){
  if (!swingRows.length || CMP.base === CMP.comp) return;
  const partisan = ['dTwo','dShare','margin'].includes(CMP.measure);
  const unit = MEASURES[CMP.measure].unit === '%' ? '% change' : 'points';
  mkChart('cSwing', {type:'bar',
    data:{labels:swingRows.map(r=>r.unit), datasets:[{data:swingRows.map(r=>r.d),
      backgroundColor:swingRows.map(r => partisan ? (r.d >= 0 ? cssv('--dem') : cssv('--rep')) : cssv('--mark')), borderRadius:2}]},
    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:i => `${signed(i.raw,1)} ${unit}`}}},
      scales:{x:{title:{display:true,text:unit}}, y:{ticks:{autoSkip:false, font:{size:11}}, grid:{display:false}}}}});
}

/* ---------- Add election ---------- */
function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.includes('\t') && !first.includes(',')) ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const toNum = s => { const t = String(s ?? '').replace(/[,$%\s]/g,''); if (t === '' || t === '-') return 0; const n = Number(t); return isFinite(n) ? n : NaN; };
function guessRole(name){
  const n = name.toLowerCase();
  if (/regist/.test(n) && /\bdem/.test(n)) return 'regD';
  if (/regist/.test(n) && /\brep|\bgop\b/.test(n)) return 'regR';
  if (/\bdem/.test(n) && /voted|cast|turnout/.test(n)) return 'castD';
  if (/\brep|\bgop\b/.test(n) && /voted|cast|turnout/.test(n)) return 'castR';
  if (/regist/.test(n)) return 'reg';
  if (/ballots cast|total ballots|voters who voted/.test(n)) return 'cast';
  if (/\btotal\b|turnout|over ?votes|under ?votes|blank/.test(n)) return 'ignore';
  if (/\(d\)|\bdem/.test(n)) return 'D';
  if (/\(r\)|\brep|\bgop\b/.test(n)) return 'R';
  return 'O';
}
function buildDraft(text, dropTotals){
  const rows = parseCSV(text);
  if (rows.length < 2) return {error:'Paste a header row and at least one row of results.'};
  const head = rows[0].map(h => h.trim());
  const body = rows.slice(1).filter(r => (r[0]||'').trim() && !(dropTotals && /^(grand )?totals?\b/i.test(r[0].trim())));
  const keep = [], dropped = [];
  for (let c = 1; c < head.length; c++){
    const vals = body.map(r => r[c]);
    if (vals.every(v => isFinite(toNum(v)))) keep.push(c); else dropped.push(head[c] || 'Column '+(c+1));
  }
  if (!keep.length) return {error:'No columns of vote counts were found. The first column should name each place; the other columns should be numbers.'};
  return {
    unitLabel: head[0] || 'Place',
    columns: keep.map(c => ({name: head[c] || 'Column '+(c+1), role: guessRole(head[c]||'')})),
    rows: body.map(r => ({unit: r[0].trim(), values: keep.map(c => toNum(r[c]))})),
    dropped
  };
}
function renderAdd(){
  const types = ['Midterm','Presidential','Special','Primary','Municipal','School board','Other'];
  const levels = ['National','State','Congressional district','County','Municipality','School district','Precinct'];
  $('#app').innerHTML = `
    <h1>Add election</h1>
    <p class="lede">Load any election, from a national race down to a single school district.</p>
    <ol class="steps"><li>Describe the election</li><li>Add the results spreadsheet</li><li>Say who each column is</li><li>Save</li></ol>
    <div class="grid2">
      <section class="panel">
        <h2>Details</h2>
        <div style="display:grid;gap:12px;margin-top:12px">
          <label class="field">Name<input type="text" id="fName" placeholder="2026 PA-1 general, Bucks County precincts"></label>
          <div class="grid2" style="gap:12px">
            <label class="field">Year<input type="number" id="fYear" value="${new Date().getFullYear()}"></label>
            <label class="field">Type<select id="fType">${types.map(t=>`<option>${t}</option>`).join('')}</select></label>
          </div>
          <div class="grid2" style="gap:12px">
            <label class="field">Level<select id="fLevel">${levels.map(t=>`<option>${t}</option>`).join('')}</select></label>
            <label class="field">Jurisdiction<input type="text" id="fJur" placeholder="Bucks County, PA"></label>
          </div>
          <label class="field">Source<input type="text" id="fSrc" placeholder="Where the numbers came from"></label>
          <label class="field">Notes<textarea id="fNotes" style="min-height:70px" placeholder="Anything worth remembering, such as unofficial or certified results"></textarea></label>
          <label class="field">Extra metrics (optional, one per line as name: value)<textarea id="fMetrics" placeholder="Approval: 41&#10;Seats defended: 12"></textarea></label>
        </div>
      </section>
      <section class="panel">
        <h2>Results (optional)</h2>
        <p class="small muted" style="margin-top:6px">Save your spreadsheet as a CSV file (in Excel: File, Save As, CSV). It should look like this, with the place names in the first column and one column per candidate:</p>
        <div class="sheet"><table><thead><tr><th class="colA">Precinct</th><th class="r">Candidate A (D)</th><th class="r">Candidate B (R)</th><th class="r">Registered voters</th></tr></thead>
          <tbody><tr><td class="colA">Township 1</td><td class="r">812</td><td class="r">640</td><td class="r">2,100</td></tr><tr><td class="colA">Township 2</td><td class="r">455</td><td class="r">701</td><td class="r">1,930</td></tr></tbody></table></div>
        <p class="small muted">The numbers above are only an example. Adding “(D)” or “(R)” after a name lets Election Lab color the columns automatically. A registered-voters column is optional but unlocks turnout. Leave this section empty to save an election with metrics only.</p>
        <div class="actions" style="margin:10px 0">
          <label class="btn ghost" style="display:inline-block">Upload CSV<input type="file" id="fFile" accept=".csv,.tsv,.txt,text/csv" hidden></label>
          <button class="btn ghost" id="bTpl">Download template</button>
        </div>
        <label class="field">Or paste results<textarea id="fCsv" style="min-height:160px" placeholder="Precinct,Harvie (D),Fitzpatrick (R),Registered voters&#10;Bensalem 1,812,640,2100"></textarea></label>
        <label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px"><input type="checkbox" id="fDrop" checked> Skip rows named “Total”</label>
        <button class="btn" id="bRead">Read results</button>
        <div id="draftOut" style="margin-top:16px"></div>
      </section>
    </div>
    <div class="actions"><button class="btn" id="bSave">Save election</button><span id="saveMsg" class="small muted" style="align-self:center"></span></div>`;
  draft = null;
  $('#bTpl').onclick = () => download('election-lab-template.csv', 'Precinct,Candidate A (D),Candidate B (R),Registered voters\nExample Township 1,0,0,0\n', 'text/csv');
  $('#fFile').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#fCsv').value = r.result; readDraft(); }; r.readAsText(f); };
  $('#bRead').onclick = readDraft;
  $('#bSave').onclick = saveElection;
}
function readDraft(){
  const text = $('#fCsv').value.trim(), out = $('#draftOut');
  if (!text){ draft = null; out.innerHTML = ''; return; }
  const d = buildDraft(text, $('#fDrop').checked);
  if (d.error){ draft = null; out.innerHTML = `<div class="notice">${esc(d.error)}</div>`; return; }
  draft = d;
  out.innerHTML = `
    <p class="small"><b>${d.rows.length}</b> places found under “${esc(d.unitLabel)}”.${d.dropped.length ? ` Skipped columns without numbers: ${esc(d.dropped.join(', '))}.` : ''}</p>
    <h3>What is each column?</h3>
    <p class="small muted">This sets party colors and lets Election Lab compute two-party share and turnout.</p>
    <div class="rolegrid">${d.columns.map((c,i) => `<span>${esc(c.name)}</span><select data-col="${i}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===c.role?'selected':''}>${v}</option>`).join('')}</select>`).join('')}</div>
    <div class="tbl-wrap" style="margin-top:14px;max-height:220px"><table><thead><tr><th>${esc(d.unitLabel)}</th>${d.columns.map(c=>`<th class="r">${esc(c.name)}</th>`).join('')}</tr></thead><tbody>
    ${d.rows.slice(0,8).map(r=>`<tr><td>${esc(r.unit)}</td>${r.values.map(v=>`<td class="r">${fmt(v)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>${d.rows.length>8?`<p class="small muted">Showing the first 8 of ${d.rows.length}.</p>`:''}`;
  out.querySelectorAll('select[data-col]').forEach(s => s.onchange = () => { draft.columns[+s.dataset.col].role = s.value; });
}
function saveElection(){
  const name = $('#fName').value.trim(), msg = $('#saveMsg');
  if (!name){ msg.textContent = 'Give the election a name before saving.'; $('#fName').focus(); return; }
  if ($('#fCsv').value.trim() && !draft){ readDraft(); if (!draft){ msg.textContent = 'Fix the results above, or clear them, before saving.'; return; } }
  const metrics = {};
  $('#fMetrics').value.split('\n').forEach(line => { const i = line.indexOf(':'); if (i < 1) return; const k = line.slice(0,i).trim(), v = line.slice(i+1).trim(); if (!k) return; const n = toNum(v); metrics[k] = (v !== '' && isFinite(n) && /^[\s$%,+\-.\d]+$/.test(v)) ? n : v; });
  const e = {id:'u'+Date.now().toString(36), name, year:+$('#fYear').value || new Date().getFullYear(), type:$('#fType').value, level:$('#fLevel').value,
    jurisdiction:$('#fJur').value.trim(), source:$('#fSrc').value.trim(), notes:$('#fNotes').value.trim(), seed:false, provisional:false, metrics,
    results: draft ? {unitLabel:draft.unitLabel, columns:draft.columns, rows:draft.rows} : null};
  state.elections.push(e); save();
  location.hash = 'election-' + e.id;
}

/* ---------- Boot ---------- */
load();
window.addEventListener('hashchange', route);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch(e){}
route();
</script>
