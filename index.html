w, a completely different world, but also the world we always knew was there. We've known being on the ground talking to people that this is the real Kansas.", "Davis, we hear incredible things about your youth and student organizing and just shout out to the youth and student organizing, to the Alliance for Youth Action, which um several of the youth groups on this call are connected to nationally, and Sunrise Movement and Voters of Tomorrow and Gen Z for Change, and I'm missing a lot of important ones. Youth showed up in incredible numbers this cycle, and just huge shout out. Also, just we're about to go to the return of the South. Okay, I'm going about to pass it to Jillian. I just want to acknowledge you're hearing a lot. It's a lot to take in. It's been like a fire hose for everyone. So, I just want to encourage people, if you want to like lie down and close your eyes and take it all in, or you know, eat some some lunch, like, you know, just just want to uh encourage people to pace themselves um for the most amazing things you're about to hear next. Jillian, can I bring you back in to talk about", "Hello. Yes, so excited to you um bring a couple of special guests uh onto the call um this afternoon to talk about the incredible victories that we had in South Carolina and Mississippi. Um Shantel Jones is going to be talking about South Carolina. Um she's with our incredible partner Cypress Fund, and then Charles Taylor will be talking about Mississippi. Um and he is with the Mississippi NAACP. Um so, we'll just get those folks on the on the screen, and we'll let them share. Um yeah, Shanti, do you want to do you want to jump in first?", "Yeah, I'm", "Thanks so much for joining.", "Thank you.", "these folks to come on like an hour ago.", "[laughter]", "Yeah, we appreciate y'all giving us some time on this really incredible day.", "Of course, and I feel like I've known Billy since I was a child, and has been invested. Um I'm from South Carolina, and Cypress started 7 years ago when no one was investing and building rural power across the state the way that we have. I love to tell folks that like we elected the first Democratic governor or Democratic senator, hopefully soon a governor, um since 1998. So, I was five the last time we had [laughter] a person um who represented us, and she won not by a small margin, by about 90,000 votes. And about 6 years ago, we really started thinking about what does it mean to invest intentionally in rural parts of South Carolina. South Carolina is a high voter registration, low turnout state, and we recognized that if we could just turn out 20 to 30,000 Black voters, we'd flip this entire state. And that's what we did over the course of this year with our partners. We were able uh to flip this Senate race by about 90,000 votes and counting. Um that is a 30-year record high turnout across the state. We have more young people vote on election day than we've had in 19 years. And this is about patient money that has consistently invested in particularly Black women's leaderships um across the state and in youth leadership. Shout out to our friends at Wren and Be the Ones and a couple of other groups that have really built this work. And it wasn't a ton of money. South Carolina is one of those states that folks come to every 4 years and then kind of abandon in between. But, we started with a governance agenda, really beating our redistricting back in a supermajority, and now taking those same folks who turned out to hear about when folks were trying to take away their voting rights, to then bring them back to the polls, to then bring back a governing agenda. We're not going to let folks push us back. We are from here. We love this place, and we've been organizing for a long time with just a little bit of money, but feel so supported by MVP and the work that they've been able to do with us.", "Thank you so much, I we're so excited with y'all. Um and I also want to welcome Asia uh Holston-Barber from Kentuckians for Non-Corruption, who's also joining us today to talk about the incredible victories that we had in Kentucky. Asia, do you want to jump in next?", "Sure. Hello. Happy post-election day, everybody. Asia Holston-Barber, she/her pronouns with Kentucky. Um I mean, wow. We had an amazing night last night. Uh first of all, I just want to shout out MVP and just all of our partners nationally. It's rare that people really believe in the South and believe in Kentucky and believe in the power of multi-racial organizing and MVP has been with us for years around that and we really showed out. I mean we flipped congressional district six. Nobody thought we could do that and we've been saying for a year that we could do it and we did it with really beautiful multi-racial organizing across our coalition. We were organizing in Fayette and Lexington and Kentucky and we were organizing in Madison and Scott County which are rural counties and doing phenomenal work across our coalition. So we're feeling really really proud about that and really kind of stunting it because we knew like we knew this is what Kentucky had to offer and so it's really really beautiful for us on that. But we didn't just win six. We actually won down ballot. So we flipped eight seats across the state in our house of um in our state house. We also flipped two senate seats. I really want to shout out our house representatives because we knocked out leadership in the state like literal leadership. Jason Nemes, Julie Rocky Adams like people who were a bit nervous but we're also a bit arrogant and so we knocked them out of their seats. They were not expecting that. Kentucky turned blue across the state in Western Kentucky in Mayfield. The first black mayor was elected and that mayor is part of a organization that's been part of our coalition for several years now. So we just we believe in Kentucky. We've been doing this for a really long time and we've got big plans. It's just the beginning. So again it's just really beautiful. So it's just really really a joy to be part of the winning team and really appreciate to be part of this with everybody on the call.", "Thank you Asia. We appreciate you and your work so much. I'm going to pass it over to Charles to talk about Mississippi. Charles, are we still 43 votes up? What is going on down there?", "We're 65 now. 65 so we we've gone we're going up. Um I I feel three things. I feel excited. I feel measured because you know and we still got to cross the tape and uh I feel deep gratitude for everyone in Mississippi and everyone outside of Mississippi who supported and believed in in in this this fight. Grateful to Scott Colone, the campaign team. You know, I'll tell you they campaign raised about $6.4 million. And they did it with with grit and grind. Asking everyone they knew to support. You know, when when it's all said and done, it's probably one of the campaigns that that I think should have gotten tens if not tens and tens and tens of millions of dollars because it showed that the opportunity was there. You know, we have to look at Mississippi as 19 2026 and not 1964. I think the Mississippi showed that to the country yesterday. So, I'm just incredibly grateful. Just a quick update. We're we're now at the process where we have to cure ballots. And so, that that process looks like folks who voted provisionally or affidavit. We have to go to every election commissioner, every office there within contest. There's 82 counties in the state of Mississippi. Five election commissioners per county. Each of them will have a number of provisional ballots that they will either reject or accept. If you went to the polls yesterday and did not bring your ID, you have until Tuesday of next week to go back to the courthouse. So, we are actively, you know, fundraising and trying to hire organizers, 500 of them across the state to to to basically, once we get the list, knock on doors, stake outside of people's houses, make them you know, nothing forceful, but tell them hop in the car uh cuz gas is high, and let's get you to the courthouse, and and bring your ID so we can get these ballots cured. Like that is going to be a big push. Uh we have folks that are on the plane now. Are we planning to have a big meeting at Tougaloo College at 7:00 p.m. for uh folks inside and outside the state that are wanting to support um and and have come down. And we're going to be talking about three things, the legal strategy around this, which the D.A. uh has uh has kind of taken the lead on. Uh so and they and they I'm grateful cuz they're hiring local lawyers as well to to so that so that we have folks who have institutional knowledge of Mississippi and folks who have practiced Mississippi law to be a part of this. Uh second piece is the organizing, which I described just a piece of it. And then the the third of it is the communications. And so, you know, we need folks to be very clear about where we are, that we are just just fingertips away from a victory, but we have to get over the finish line. Um I'm I'm I'm so thankful to Movement Voter Project, uh as deep thanks to the billion, especially thanks to Jillian. You know, as as they have been to Mississippi over the last few years, you know, we've been talking about this fight. Um and I the other thing I remind you is that at some point, I'm excited cuz I'm going to call Scott Colom my senator, but that very next day, I got to get up and fight again because our state legislators planning to do a special session around redistricting as early as Monday. So, we we ready. The last thing I just want to say is I want to give a that a really deep appreciation for who Scott Colom is personally. Um you know, I I work for a non-profit, but I'm maxed out on them. I'm not a maxed out kind of guy. Uh, not cuz I don't love people, just don't have the pocketbooks to do so. Uh, but that's how much I believed in him as a candidate. Um, I I we've been great friends for a long time, but it's also that's how much I believed in his team. Um, and and and the incredible work that they that they have done to get us to this point. Uh, and and and not afraid to be fresh uh, and being unapologetic when it come to understanding that it was going to be black voter turnout that was going to help us to get over this finish line. Uh, you know, the the I know I said that was the last thing, but the very last thing that I went to bed with um, last night we had a supporter who said to us, \"What else you want to do on election day? We have resources.\" And so we ended up not not we wasn't uh, projected to do so, but but we ended up sending out 1.4 million text messages. We had nine live radio remotes across the state where we, you know, just took over the radio station. And in some instances, we had to call one of our members cuz the radio station said, \"Sure, you can have it for 3 hours, but who's going to host it?\" And so like and and like down on the coast, our deputy director, she she became a radio personality yesterday telling people to to go out and vote. And then lastly, um, there were some Jackson State students that came into the office. And I said, \"How would you feel about 100 boxes of pizza right now to go into the dorms?\" And they were and they did it. They got students out to vote. And so in my eyes, when I think about that 60 um, five vote difference, I genuinely believe it was it was the young people in Mississippi who got us to this place. So, uh, I'm just that's where I am in this moment.", "Thank you so much, Charles. Thanks, everybody. I'm going to Sorry, Billy. I'm going to pass it back to Billy.", "Yeah, no, this is so incredible and I just want to say first of all that anyone who wants to donate directly to any organization you're hearing on this call, um you can do so. We're happy to to help put you in touch. Um and um and also I mean, what you all have achieved is like incredible, phenomenal. Um and we actually have a couple more minutes um because we've been good on time. Shantey, you did you you were very um concise. Um wonder if if you want to just say a little bit more having built the organizing ecosystem in um South Carolina, you know, in collaboration with so many over so many years. Like uh you know, South Carolina was the shocker last night and then Mississippi is like the shocker today. You know, like what what is this like for you? What is it like for for um the organizations that you're you're working with?", "Yeah, if you lived in South Carolina, this wasn't a shock to you at all. We have seen Dr. Andrews everywhere across the state at homecomings, at doctor's appointments, at people's childcare centers, but we've also just been talking to each other. For the last decade plus, we've been super involved in building an organizing bench and at the center of that leadership are black women in rural parts of the state. Folks who never got invested in, who never got someone to sit with them and say, \"Hey, what you think is important to me and I want to be able to move that along.\" It has been this consistent investment in each other, showing up, um being at each other's cookouts, showing up to each other's churches, setting up kitty pools, going to pig picking. Like we are talking about the kind of slow, patient growing that doesn't happen over one or two conversations or a thousand doors knocked, but really over the the person you see time and time again at the grocery store and deeply investing in the leadership development bench that happens here. South Carolina built so many brilliant leaders that just can't afford to stay. So, by making sure that we're building up our care infrastructure, thinking about how people are able to pay their rent, getting together when someone is being attacked by the police, but also getting together across lines where real communities where everything impacts us regardless of our race, because we're all impacted by the fact that Spectrum internet is awful. All right, that like Duke Energy is taking us out being able to support local owned farmer owned cooperatives that help lower our electric bills from $600 to $40. That's the kind of like caring for neighbors that happen and being able to say it's groups like Cypress and Grove that have been invested in the back-end infrastructure in these spaces that make so many of these material changes more possible and making sure folks have gas cards and the training to be able to come up and talk to their statehouse, running statehouse tours and city council tours, making sure that, you know, folks know I love to tell people like we beat our redistricting and they didn't even vote on it because we had so many people showing up every single day and passing out biscuits and jam and sandwiches and sitting outside with folks and watching folks' kids and just being together with folks in that room to let senators and house of representative members know that like we're not going anywhere and you're going to have to respond to us. So, this is what it looks like to build in the South. It's slow, it's consistent, it's deliberate, but it's the kind of work that lasts whether another election comes or not. We're still here organizing in our communities and moving the work forward.", "Thank you for your brilliant organizing, all three of you, Asia, Shantay, and Charles Taylor. And Charles, we feel so bad having you on the phone when you're you you you need to be uh organizing this ballot curing and don't want to put you on the spot about how much money is needed or what that situation is, but if you want to share anything on that, and otherwise we'll be sending uh you know, energy and thoughts your way uh as you you close this deal this year and next year. We heard you very clearly.", "Um the the quick and dirty of it, we need about $2 million. We need to hire about 10 I mean 500 organizers for 10 days and uh to be in all 82 counties, plus the infrastructure that that that uh goes along with that. Um you know, so we have to have folks out um in those areas and and that that's that's really what we're trying to get to is is is is just that.", "Okay, we're uh we'll follow up with you afterwards and I hope all the funders heard that, okay? So, thank you all and just deep deep gratitude and appreciation for all the organizers and organizations in the South that are so underfunded, so unsung, all the black organizations around the country that have been so underfunded and so unsung and that really showed up this election cycle. And that's a segue to I'm going to give you some big picture and then we're going to close it out with a special treat. You're going to actually get to hear from an incredible organizer from the Rio Grande Valley, which flipped like bananas this cycle. So, zooming out um and I think we have some slides for this, yeah? So, this is a thank you to everyone. So, just first of all, I just want everyone to just take a deep breath. And just just like take it in. The brilliance, the dedication, the years and years of unsung hard work that you heard on this call and that were a huge part of yielding these victories that we're basking in the glow of right now. And I just want to thank everyone in this call. Like, holy people like gave Some people gave till they hurt. You know, people volunteered hours and hours and organized so many house parties reached out to friends when everyone was depressed. You did it. We did it and um that those stats were just a quick and dirty of the collective power through that we moved together through this MVP vehicle to all these these partners. Um and so I want to zoom out and just say looking forward just want to take a moment to look forward. This day is all about celebrating, but I want to look forward. This is a three year and a six-year plan. We're going to talk a lot of more about that in our forward-looking briefing in December. I want to invite people. We're not just like oh so give money fast. The ask is to take this moment in and the enormity of what we can do together when we all work together with our organizing partners and with each other and make a three-year plan, make a six-year plan over the holidays of how you with your time, talents, and connections, and ideas can be as involved in this movement as possible. Um so this on the screen right now are are are simple ways to contribute right now um if people are looking to do that. Otherwise if you are already in the MVP network, if you have a liaison and a donor advisor, reach out to the donor advisor and just say let's brainstorm. Let's brainstorm the future together. And we don't want to chase you around and have you not, you know, call us back. You know, which is what usually [clears throat] happens. You know, all through 2027. You know, we want to have like big generative conversations together. Like what can we do together um that are long-term where we're committing together just like all the organizers you've heard have committed their lives to this work on behalf of all of us. So, I want to offer that inviting everyone while we have people's attention that we can't let it go after this. Otherwise, we're going to end up in the same place. So, let's celebrate and let's really believe in this vision together and build this together. And with that, I'm going to pass to my incredible colleague, Alicia Garrity, who is our director of donor organizing, who gets to work with all our incredible, brilliant volunteers, who are there's a staff team and a volunteer team, and we work together, and that's the magic of MVP. Passing it to you, Alicia.", "Thanks so much, Billy. Yay! No, I I'm feeling great. Um hi, everybody. Alicia Garrity. Um I'm here in Washington, D.C. So, thank you for sending more good people our way. We just um elected officially our Democratic Socialist Mayor, Janice Lewis George. Very excited about her. But, yeah, I'm super energized, as Billy said. Um I have And I say I've been with MVP for coming up on 5 years, and I like to say, because I believe it, I have I think the best job here. Um I get to work with the best, smartest colleagues. We're doing the best um we have the best strategy. We fund the best partners and grant tea groups on the ground. And I get to work with our ambient strategic partnership with our own um base of volunteers. And what that looks like at MVP is a base is a donor base that is um doing their own relational organizing to recruit their networks and uh fundraise for the movement um work and vision of the future we believe in. I think, too, like it's easy to say today that I have the best job ever when we're celebrating so much, but I have been saying this for years. I think a lot about, you know, post-2020 for election, when I think a lot of you know, it was painful. A lot of people I think needed space and time. We had so many volunteers. A lot of you I see on the call. Going to shout some of you out. Dana Brooks, Andrew Bundy, our Bay Area. We have a team in Washington state and Atlanta. Susan Susan Rutherford, our Western Eastern Mass national team, Janet Morrison. You know, really kind of doubled down and and understood that this is a moment to keep at it and keep them commitment going and and work to, you know, invest in organizing. And in the past 2 years our volunteers have raised over $6 million and, you know, a lot of this has been through house parties and events. Over 270 events. So, huge thank you to that community of people who have made this happen. Um, among them have been, you know, our healthcare leaders for democracy group, our lawyers community for democracy. And somebody who I called in there's so many people I would love if you can share in the chat if the chat's open. What you all who have been, you know, part of our volunteer donor organizing program, something that's made you proud over the last year that you've done, please share it in the chat. I also invited Mary Ann Rudder to share just verbally with us one thing. Mary Ann has been with us in in this program, you know, for the whole time I've been on staff. She has supported our Eastern Mass um, uh, team, our healthcare leaders for democracy, lawyers for community for democracy. So, excited to to have you here Mary Ann just share a couple words. And so nice to see you.", "Well, Alicia, thank you. I'm really proud to be doing this. Um but the reason I do it is that MVP gives me the opportunity to participate in a more diverse America in ways I think are the realer America than the white bubble of privilege in which I live. I'm lucky. But a lot of this participation is remote and somewhat passive, such as listening to testimony by a grassroots partner on a Zoom call. But then we, the donor organizers, are on deck to raise the money that allows This is inspiring work to go on. And this is what makes my privilege a form of activism that reaches and supports and achieves change for people in corners of America that I don't know and can't reach personally. So, you know, it works out really well for me and I I now feel like it's working out really well for a lot of other people. It's given me a window into a wider swath of my fellow Americans, what what they see and yearn for in the American dream, which we've taken for granted until now. But a lot of the candidates have talked about it, and in the end, we all want many of the same things. And we want democracy done right to help us achieve those things together. So, best It's the best job I've ever had.", "[laughter]", "And I encourage other people to join us.", "Thanks, Mary Ann. And um you know, if you're looking uh to get more involved uh in the volunteer program of donor organizers with MVP, we have a um session November 18th. Somebody's going to drop a link in the chat if you want to join. It's kind of like a volunteer orientation call. But again, thank you all uh for being here, being in this. Um it's so meaningful to get to share this this time with everybody.", "Yeah, a super shout-out to our volunteers and the and the donor organizing team. And it's it's they're our it's it's one of the best volunteer programs. We try to make it one of the best voter volunteer programs in the country for people to have an incredible experience. And it's even for introverts who like don't you know, we have thanking programs, we have behind the scenes things. Um, so a lot of people's first thing is like, well, I don't know any rich people and I don't like to ask for money. There is a place for everyone who wants to get involved and you can sign up right on the website um, in that upper corner, uh, you can sign up to volunteer and we have such a great team. We also have MDP 101's that you can come to to to, you know, get to know the organization, have your questions answered, etc. Um, cuz we're trying to have a wide funnel to when we're really going to succeed is is when we build a movement that is at scale, right? We have probably 100 amazing super volunteers right now. How do we get that to 200, 300, 1,000? Once we can get to that, that's when we can scale the resources that the movement actually needs. And it's doable. So, let's make that a thing that we do together. Um, you're invited and think of think of other people you know who might want to be involved. So, with that, um, we saved a treat for last, which is to bring back our Texas crew, Val and Myrna, and they have a special guest, and then we're going to just have a few closing reflections. Um, and Val, you can kick it off.", "Yeah. So, you know, other exciting news from Texas is that we have officially claimed the Texas House as well. So, this is a very exciting development", "What?", "um,", "[clears throat]", "to add into the mix. Yes. Um, and then I just, you know, want to say that we know that there is so much work to do moving forward. We don't take that lightly. It's time to deliver for the people of Texas, for the people of the whole country. I mean, really, what we've seen is this strong desire for change and we're so excited to think about the many possibilities, but I do want to make sure that we take a moment for all of us today to really celebrate like the magnitude of this and what it means, you know, in places like Texas and South Carolina and Mississippi, Arizona. It's just truly incredible. Um so I'm so thrilled to be on the call. I don't know where Myrna is, if she's going to join me in this box or not. There she is. So I'm going to pass it over to Myrna now and let Myrna introduce Tanya.", "Yeah, I'm so excited because we keep winning y'all and it's um it's by the work of some of our amazing partners. I don't think I'll ever get over the crying and the happiness and the joy that I'm feeling. I told someone earlier, I'm going to start being insufferable um and now I get to claim I'm a Texan. 12 years later I will finally say, um I live here and uh claim it and rep it and the hope that I felt in 2008 is like resurfacing and rebubbling and it's because of people and organizations like Tanya who have been doing this work for the past 15 plus years when I first met her um as a student organizer. I don't remember if we were students. What is time anymore? Um uh working on immigrant rights. Uh Tanya now leads La Union del Pueblo Entero or Lupe and Lupe Votes um in the Valley um where they were a just able to flip um a seat uh Texas 15 that had gone 18 points for Trump um in 2024 and so um I'm really excited to have her join us and tell her about tell us about um what it's like to be in the Valley right now, what it's like to um to relish this victory, to also just say thank you for all of the work that you all did. Um they had over 300 canvassers y'all and the staff grew to about that size, knocked on thousands of doors and did so much um to make this moment happen and I'm just so honored to be in partnership um with Tanya uh Lupe Votes and all of the people and communities they work with.", "Thank you, Mirna, for that introduction. We are static because this victory belongs to the people of Texas. Yes, we did the work. We knocked on doors. We were able to be instrumental to ensuring that folks had the opportunity to learn about their voting rights, but ultimately people were loud about the change that they wanted to see in their own community. And that belongs to no one other than the Texas voters. And here's here's the thing about Lupe and the work that is happening in the Rio Grande Valley. It doesn't matter if you are a US citizen or not. We all went to the polls. Why? Because if you were a citizen, you went to go vote. And if you were not a citizen, you took your mom, your mama, your theo, your abuelita to go cast that vote for you. So, for me, it's incredibly incredibly important to know that we have flipped a congressional district, that we have flipped a state a the state house district, and that we have also flipped the school board of education. So, we've had a lot of wins for our community. Our entire endorsement slate was uh won. We are a tiny team of 60 people doing work in a four-county region of South Texas. And we were able to knock on 90,000 doors, mobilize to the polls 110 thousand voters. I think it's The idea of saying thousands, that we had that ability to turn people it it's just I'm still not believing it. I'm still not believing that we did that. Also, I was ready to throw it down and go to court, and we had signed legal agreements, and all of a sudden last night the election was called around 10:00 p.m. What an incredible win for our community. We had over 100 poll monitors from early voting all the way to election day from 7:00 a.m. to 7:00 p.m. being at every poll sharing the information about their voting rights, voter assistance, curbside voting, suspension list, and how you vote if you were in that list. Election day was peaceful. We are here celebrating a huge huge win for our community. And one of the things that we're thinking about is we knew we were going to win and we knew we were going to win big. We just didn't realize we were going to win this big. And so now we have uh turned the state, now that we have helped realize a new reality for Texas, we have to roll back all the harm. And we need to roll up our roll up our sleeves and we're actually thinking about what is it going to take. How do we need to reframe our organizing work? I will tell you. We we won help people like you, Annie, who are going to be changing the landscape of Texas because it's not about flipping Texas today, it's about keeping it blue for decades to come. And the work that we were able to do wasn't just built in this election cycle. We've been knocking on doors and we've been doing house meetings under a tree for decades. That is the sauce in South Texas. We do the farm work organizing model, which is meeting people where they're at through house meetings. We hosted over 500 meetings a year under trees, outside people's homes, in the sun. Our family sometimes canoe out of their colonias because they don't have paved roads, they don't have street lights. And now that we're seeing ICE kidnapping our people, our communities felt enough. Basta. We will take our state back and they did. And so we have to help them rebuild. And for that, we're going to have to hone in on those organizing skills. We're going to have to reconfigure our team. We've always been on the offensive. We've been like How are we going to fight back? And now we can actually co- co-govern together. We can actually sit down with elected officials and say, \"This is what we can do and this is how you repeal the harm. And if you don't want to do it, well then we'll just find somebody else to run against you next time.\" Right? Because now we know that we have that power to do that. And so we will sit down with them. We will engage in conversation, but also organizing takes a lot of time. Organizing takes a lot of people power. It takes skill and it takes decades to win. And so now that we're in this moment, we have to sustain. We need to think about how we Can we ask Gina and Anna to get access to Medicare for all, right? Expand on the Obamacare that we all dream for for Texas. Can we get rid of 287G agreements in this entire state and kick ICE out of our communities? Oh, because I have a laundry list for her already, ready to go. Right? Like we have been doing this work for a long time. Bring back the Texas Dream Act. Kick out the administration out of the litigation they filed. Repeal all the anti-voting laws laws that they did on SB 1 of the 2021. I will be very happy cuz we have many lawsuits against the state of Texas and so it would actually make my load easier if I don't have to go to court. How are they going to fight the census and the fact that they want to disenfranchise immigrants like myself and many others who will not be counted in the 2030 census? How is Texas now going to fight the administration to ensure every immigrant gets counted? Every person who's not a citizen gets counted? Because it's not about It's not only about what happened, but it's also about how we're going to fight this administration together as a team. And we will need all of your support to do that. How to like Honestly, you'll have no idea. I came to Mirna and I said, \"Mirna, I don't know how I'm going to make this work.\" Because we joined a funder call and one funder joined our briefing. And we started this campaign with 150,000 from the last cycle and 40 canvassers. And I told Mirna, \"I am going to hire because I believe the money is coming and we're going to do this together.\" And the money kept flowing because we kept asking Mirna and Mirna kept delivering because she was asking all of you. I'm just incredibly happy of what we've been able to do, what we've been able to support. And this is not the end. This is just the beginning of the change in Texas. And we get to do that and determine that. We get to see with elected officials and co-govern. A lot of people say like, \"Well, is it Bobby Pulido effect?\" No. It's the years of organizing that we have built. He helped. You know, he's famous. But at the end of the day, it is the people who took the state back. And that was loud. So loud. And the RGV played a pivotal role to ensure that that took place. And we will keep it that way with your help and with your support.", "Thank you so much, Tania. I am ready. I am fired up. I'll follow you and Lupe team um forever. Uh thank you so much for helping us have the possibility to dream of all of the good things that we can do together in Texas. Back to you, Bobby.", "It se puede. Si se puede. And I'll tell you this to close off. Our founder, Dolores, passed away last week. And in the middle of the season, rather than honoring her and taking a step back, the team decided to go door-knocking on her name in her honor. And to power down our work in her honor, because that's what she would have liked to do. And that is really what pushes forward to the finish line. And the support that you all gave us, and the guiding spirits that we have above us, we were able to make it happen. Si se puede.", "Si se puede, si se pudo, y si se va a poder. Si se pudo.", "No one could have said it better. And from the Rio Grande Valley to Mississippi, to Florida, to Kansas, to Alaska, to Maine, to Michigan, to every part of this country, us believing together, no matter what the political situation is, that's how we win Texas. That's how we can win Mississippi. That's how South Carolina shocked the world. That's how Iowa just shocked the world. And we are so grateful to be on this journey together with everyone. Everyone, the MVP team, which is so incredible. It's such an incredible team. The MVP volunteer team, which is such an incredible team. To all of you who are donors, to and through all of these partners, to MVP, to all of our partners. Doesn't matter, we're all a team. Doesn't matter which way you give the money through. We're all one big team. And if you've been on this ride with us, just so much gratitude. Like, we see you. We thank you. We appreciate you. If you don't feel seen and appreciated, call us and be like, \"Hey, you haven't talked to me.\" Like, we need you on this journey. And we're going to all have to figure out how to step up to be better together. You know? Like, figuring out how to co-govern in Texas, in Georgia, in states with trifectas, in states of divided government, in states where we have another 10 years to go. It's hard hard work. And let's take this joy and turn it into like a rocket ship, not an Elon Musk rocket ship, but like a human beautiful rocket ship of love and care together to transform this country, which is you know, just in reach. We can do this. So, just want to invite you all on the journey for us and there's just 2 minutes left. I just want to ask if there's anyone else on the team who has any closing notes before we close cuz I'm sure I forgot a lot of important things. And we'll end with just deep gratitude for everyone. We we did an incredible thing over the last couple years. It was really hard. Our partners did incredible things and they were the frontlines. They are the frontlines. We were the supply line. We are the supply line. We are going to be the best supply line this movement has ever had. Imagine if we could move twice as much money to these organizations. Imagine what they could do. Imagine. Imagine how we could change this country. So, thank you all for being part of it. We are so grateful for this last chapter and so excited to take this next step with you all. And just know that you are part of this. And we're going to have another gathering like this in December where we're going to reflect and talk about the road going forward. Bunch of our partners are having briefings. Indivisible is having a briefing tonight. Working Families is having a briefing next week. Um don't ever feel alone or not connected. Just reach out and and we'll make sure that you're connected. I see Rebecca Ennen nodding her head who talks with so many of our donors and and they're so everyone on our team wants to be working with you together on this. And it's 3:59. You guys stayed on for 2 hours. You're so committed. You're so beautiful. You're so wonderful. Just thank you. Thank you. Thank you. I hope you take some time to feel proud and to let this sink in and to experience the beautiful, amazing bonkers ness of what just happened. And a lot of it was the political environment, but a lot of it was us. And let's let's hold this moment precious. Hold each other precious as we move into this next chapter together and build this beloved movement that will change this country to what it needs to be. Thank you all so much. Go team. And have a wonderful rest of your week."]}</script>

const RAW = [
 [1934,'Franklin D. Roosevelt','D',0,null,313,14,9,9],

  return RAW.map(([year,pres,party,ld,appr,hd,sd,hc,sc]) => {

      metrics:{president:pres, party, lameDuck:ld?'Yes':'No', approval:appr, houseDefend:hd, senateDefend:sd, houseChange:hc, senateChange:sc},
      results:null};
    if (year === 2026){
      e.provisional = true;
      Object.assign(e.metrics,{houseChange:null, senateChange:null, houseChangeLow:-52, houseChangeHigh:-41, senateChangeLow:-9, senateChangeHigh:-8});
      e.seats = {
        house:{before:{D:213,R:220,U:2,uLabel:'Vacant'}, after:{D:255,R:168,U:12,uLabel:'Still counting'}, majority:218},
        senate:{before:{D:47,R:53,U:0}, after:{D:55,R:44,U:1,uLabel:'Still counting'}, majority:51}
      };
      e.notes = 'Provisional as of Nov 11, 2026. AP count: House D 255, R 168, 12 races uncalled (one of them is between two Democrats); Senate D 55, R 44, with Alaska uncalled until its ranked-choice count on Nov 18. AP called Mississippi for Democrat Scott Colom on Nov 11. That is why results read “at least 41, possibly 52”: at least 41 if Republicans win every remaining race they can, possibly 52 if they lose them all. Approval is Gallup’s late-August reading, the latest in the source table. Update these numbers once results are certified.';
    }
    return e;
  });
}

const PARTY_PLURAL = {D:'Democrats', R:'Republicans'};

const rangeText = (hi, lo) => hi <= 0 ? `lost at least ${-hi}, possibly ${-lo}` : `gained at least ${lo}, possibly ${hi}`;

const ROLES = {D:'Democratic candidate', R:'Republican candidate', O:'Other candidate', reg:'Registered voters', cast:'Ballots cast (total)', regD:'Registered Democrats', regR:'Registered Republicans', castD:'Democrats who voted', castR:'Republicans who voted', ignore:'Ignore'};

/* ---------- State ---------- */
const KEY = 'electionLab.v1';
let state = {elections:[]};

const H = {chamber:'house', measure:'seats', range:'all', view:'simple'};
const CMP = {base:null, comp:null, measure:'dTwo', q:''};

function load(){
  let stored = [];
  try { const s = localStorage.getItem(KEY); if (s){ const d = JSON.parse(s); if (d && Array.isArray(d.elections)) stored = d.elections; } } catch(e){}

}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString();
function signed(n, d=0){ if (n == null || !isFinite(n)) return '—'; const a = Math.abs(n).toFixed(d); return (n > 0 ? '+' : n < 0 ? '\u2212' : '') + a; }
const pct = (n, d=1) => (n == null || !isFinite(n)) ? '—' : n.toFixed(d) + '%';
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const norm = s => String(s).toLowerCase().replace(/\s+/g,' ').trim();
const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function alpha(hex, a){ const h = hex.replace('#',''); const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

function mkChart(id, cfg){

}
function clearCharts(){ Object.values(charts).forEach(c => c.destroy()); charts = {}; }

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();

}

/* ---------- Results math ---------- */
function tally(values, cols){
  let D=0,R=0,O=0,reg=0,cast=0,regD=0,regR=0,castD=0,castR=0;
  values.forEach((v,i) => { if (!isFinite(v)) return; const r = cols[i].role;
    if (r==='D') D+=v; else if (r==='R') R+=v; else if (r==='O') O+=v; else if (r==='reg') reg+=v;
    else if (r==='cast') cast+=v; else if (r==='regD') regD+=v; else if (r==='regR') regR+=v; else if (r==='castD') castD+=v; else if (r==='castR') castR+=v; });
  const tot = D+R+O;
  return {D,R,O,tot,reg,cast,regD,regR,castD,castR,
    dTurn: regD ? castD/regD*100 : null, rTurn: regR ? castR/regR*100 : null,
    dTwo: (D+R) ? D/(D+R)*100 : null,
    dShare: tot ? D/tot*100 : null,
    margin: tot ? (D-R)/tot*100 : null,
    turnout: reg ? (cast || tot)/reg*100 : null};
}
function summarize(e){
  if (!e.results) return null;
  const cols = e.results.columns;
  const sum = cols.map(() => 0);
  e.results.rows.forEach(r => r.values.forEach((v,i) => { if (isFinite(v)) sum[i] += v; }));
  return Object.assign(tally(sum, cols), {units: e.results.rows.length, colTotals: sum});
}
const MEASURES = {
  dTwo:{label:'Democratic share of two-party vote', unit:'pts'},
  dShare:{label:'Democratic share of all votes', unit:'pts'},
  margin:{label:'Margin, Democrat minus Republican', unit:'pts'},
  turnout:{label:'Turnout (votes ÷ registered)', unit:'pts'},

};

  ({story:renderStory, history:renderHistory, library:renderLibrary, compare:renderCompare, add:renderAdd, detail:renderDetail, glossary:renderGlossary, playbook:renderPlaybook, turnout:renderTurnout, references:renderReferences, ref:() => renderRefReader(detailId)})[view]();

}

/* ---------- Midterm history ---------- */
function midterms(){ return state.elections.filter(e => e.type==='Midterm' && e.level==='National' && e.metrics && e.metrics.houseDefend).sort((a,b)=>a.year-b.year); }
function change(e, ch){
  const m = e.metrics, v = m[ch+'Change'];
  if (v != null && v !== '') return {v:+v};
  if (m[ch+'ChangeLow'] != null) return {lo:+m[ch+'ChangeLow'], hi:+m[ch+'ChangeHigh']};
  return null;
}
function scaled(e, ch, x){
  if (H.measure === 'pct'){ const d = +e.metrics[ch+'Defend']; return d ? x/d*100 : null; }
  return x;
}
function linreg(pts){
  const n = pts.length; if (n < 3) return null;
  let sx=0,sy=0,sxx=0,sxy=0; pts.forEach(p => { sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; });
  const b = (n*sxy - sx*sy)/(n*sxx - sx*sx), a = (sy - b*sx)/n, my = sy/n;
  let ss=0, st=0; pts.forEach(p => { ss += (p.y-(a+b*p.x))**2; st += (p.y-my)**2; });
  return {a, b, r2: st ? 1-ss/st : 0, n};
}

const viewSeg = () => `<div class="seg" role="group" aria-label="View">

}
function renderHistory(){
  if (H.view === 'simple') return renderHistorySimple();
  const ch = H.chamber, dp = H.measure==='pct' ? 1 : 0;
  const unit = H.measure==='pct' ? '% of seats held' : 'seats';
  const start = {all:0, postwar:1946, modern:1978}[H.range];
  const list = midterms().filter(e => e.year >= start);
  const settled = list.filter(e => { const c = change(e,ch); return c && c.v != null; });
  const latest = list.filter(e => { const c = change(e,ch); return c && c.v == null; }).pop();
  const pts = settled.filter(e => e.metrics.approval != null).map(e => ({x:+e.metrics.approval, y:scaled(e,ch,change(e,ch).v), year:e.year, party:e.metrics.party}));
  const reg = linreg(pts);

  $('#app').innerHTML = `
    <h1>Every midterm since 1934</h1>
    <p class="lede">The same history as charts. “Share of seats held” puts years with very different majorities on the same scale: losing 30 seats hurts more when you only held 180.</p>
    <div class="controls">
      ${viewSeg()}
      <div class="seg" role="group" aria-label="Chamber">
        <button data-h="chamber:house" aria-pressed="${ch==='house'}">House</button>
        <button data-h="chamber:senate" aria-pressed="${ch==='senate'}">Senate</button>
      </div>

// Parliament-style seat chart: one dot per seat. Big numbers and the verdict are part of the picture.
function hemicycle(s, majority, chamber){
  const D = cssv('--dem'), Rc = cssv('--rep'), G = cssv('--rule'), ink = cssv('--ink'), mut = cssv('--muted');
  const groups = [{n:s.D, c:D}, {n:s.U||0, c:G}, {n:s.R, c:Rc}];
  const total = groups.reduce((a,g)=>a+g.n,0);
  const rows = total > 200 ? 11 : total > 60 ? 6 : 4, r0 = 0.38;
  const radii = [...Array(rows)].map((_,i) => r0 + (1-r0)*i/(rows-1));
  const sum = radii.reduce((a,b)=>a+b,0);
  const counts = radii.map(r => Math.floor(total*r/sum));
  let rem = total - counts.reduce((a,b)=>a+b,0);
  for (let i = rows-1; rem > 0; i = (i-1+rows)%rows){ counts[i]++; rem--; }
  const pos = [];
  radii.forEach((r,i) => { const k = counts[i]; for (let j=0;j<k;j++) pos.push({a: Math.PI*(1-(k===1?0.5:j/(k-1))), r}); });
  pos.sort((p,q) => q.a - p.a || p.r - q.r);
  const W=360, cx=180, cy=176, R=165;
  const dotR = Math.min(9, (R*(1-r0)/(rows-1 || 1))*0.42);
  let idx = 0, out = '';
  groups.forEach(g => { for (let k=0;k<g.n && idx<pos.length;k++,idx++){ const p = pos[idx];
    out += `<circle cx="${(cx+R*p.r*Math.cos(p.a)).toFixed(1)}" cy="${(cy-R*p.r*Math.sin(p.a)).toFixed(1)}" r="${dotR.toFixed(1)}" fill="${g.c}"/>`; } });
  const who = s.D >= majority ? ['Democrats', D] : s.R >= majority ? ['Republicans', Rc] : ['No majority', mut];
  const F = 'font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif"';
  return `<svg class="hemi" viewBox="0 0 ${W} 262" role="img" aria-label="${chamber}: ${s.D} Democrats, ${s.R} Republicans${s.U?`, ${s.U} ${s.uLabel||'other'}`:''}. ${who[0]} ${who[0]==='No majority'?'yet':'control'}.">
    ${out}
    <line x1="${cx}" y1="${cy-R-6}" x2="${cx}" y2="${cy-R*r0-6}" stroke="${ink}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
    <text x="${cx-R*0.69}" y="${cy+56}" text-anchor="middle" ${F} font-size="54" font-weight="700" fill="${D}">${s.D}</text>
    <text x="${cx+R*0.69}" y="${cy+56}" text-anchor="middle" ${F} font-size="54" font-weight="700" fill="${Rc}">${s.R}</text>
    ${s.U ? `<text x="${cx}" y="${cy+50}" text-anchor="middle" ${F} font-size="30" font-weight="700" fill="${mut}">${s.U}</text>` : ''}
    <text x="${cx-R*0.69}" y="${cy+76}" text-anchor="middle" font-size="13" fill="${mut}">Democrats</text>
    <text x="${cx+R*0.69}" y="${cy+76}" text-anchor="middle" font-size="13" fill="${mut}">Republicans</text>
    ${s.U ? `<text x="${cx}" y="${cy+68}" text-anchor="middle" font-size="12" fill="${mut}">${esc(s.uLabel||'Other')}</text>` : ''}
    <text x="${cx}" y="${cy+82}" text-anchor="middle" font-size="11.5" fill="${mut}">${majority} needed to control</text></svg>`;
}
function controlTitle(s, majority, chamber, when){
  const who = s.D >= majority ? ['Democrats control', 'var(--dem)'] : s.R >= majority ? ['Republicans control', 'var(--rep)'] : ['No majority yet', 'var(--muted)'];
  return `<div class="hemi-title">${chamber}, ${when} the election</div><div class="verdict" style="color:${who[1]}">${who[0]}</div>`;
}
// Half-circle dial for approval rating.
function gaugeSVG(v){
  const cx=120, cy=118, R=92;
  const pt = t => { const a = Math.PI*(1-t/100); return [cx+R*Math.cos(a), cy-R*Math.sin(a)]; };
  const arc = (t0,t1) => { const [x0,y0]=pt(t0), [x1,y1]=pt(t1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const a = Math.PI*(1-v/100), nx = cx+R*0.72*Math.cos(a), ny = cy-R*0.72*Math.sin(a);
  return `<svg class="gauge" viewBox="0 0 240 178" role="img" aria-label="Approval rating ${v} percent">
    <path d="${arc(0,100)}" stroke="${cssv('--rule')}" stroke-width="16" fill="none"/>
    <path d="${arc(0,50)}" stroke="${cssv('--mark-soft')}" stroke-width="16" fill="none"/>
    <path d="${arc(0.5,v)}" stroke="${cssv('--mark')}" stroke-width="16" fill="none"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${cssv('--ink')}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="${cssv('--ink')}"/>
    <text x="${cx}" y="${cy+46}" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="32" font-weight="700" fill="${cssv('--ink')}">${v}%</text>
    <text x="${cx-R}" y="${cy+20}" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">0</text>
    <text x="${cx}" y="${cy-R-14}" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">50</text>
    <text x="${cx+R}" y="${cy+20}" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">100</text></svg>`;
}
// Number line of every midterm's House result, with the chosen year highlighted.
function rulerSVG(list, sel, ch){
  const vals = list.map(e => change(e,ch)).filter(Boolean);
  const all = vals.flatMap(c => c.v != null ? [c.v] : [c.lo,c.hi]).concat([0]);
  const mn = Math.min(...all)-4, mx = Math.max(...all)+4, W = 340, y0 = 70;
  const x = v => 16 + (v-mn)/(mx-mn)*(W-32);
  const bins = {}; let dots = '';
  list.forEach(e => { if (e === sel) return; const c = change(e,ch); if (!c || c.v == null) return;
    const k = Math.round(x(c.v)/9); bins[k] = (bins[k]||0)+1;
    dots += `<circle cx="${x(c.v).toFixed(1)}" cy="${y0-8-(bins[k]-1)*9}" r="3.6" fill="${partyColor(e.metrics.party)}" opacity=".55"><title>${e.year}: ${signed(c.v)}</title></circle>`; });
  const c = change(sel,ch), mark = cssv('--mark');
  const hl = c.v != null
    ? `<circle cx="${x(c.v)}" cy="${y0-10}" r="7" fill="${mark}" stroke="${cssv('--ink')}" stroke-width="1.5"/>`
    : `<rect x="${x(c.lo)}" y="${y0-18}" width="${Math.max(4,x(c.hi)-x(c.lo))}" height="14" rx="7" fill="${mark}" stroke="${cssv('--ink')}" stroke-width="1.2"/>`;
  return `<svg class="ruler" viewBox="0 0 ${W} 110" role="img" aria-label="Where ${sel.year} falls among all midterms">
    <line x1="16" y1="${y0}" x2="${W-16}" y2="${y0}" stroke="${cssv('--ink')}" stroke-width="1.5"/>
    <line x1="${x(0)}" y1="${y0-4}" x2="${x(0)}" y2="${y0+6}" stroke="${cssv('--ink')}"/>
    ${dots}${hl}
    <text x="${x(0)}" y="${y0+20}" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">no change</text>
    <text x="16" y="${y0+36}" font-size="12" fill="${cssv('--muted')}">bigger losses</text>
    <text x="${W-16}" y="${y0+36}" text-anchor="end" font-size="12" fill="${cssv('--muted')}">gains</text></svg>`;
}
function miniBars(list, ch, hlYear, avg){
  const cs = list.map(e => change(e,ch)).filter(Boolean);
  const max = Math.max(1, ...cs.map(c => Math.abs(c.v != null ? c.v : c.lo)));
  return `<div class="mbars">${list.map(e => { const c = change(e,ch); if (!c) return '';
    const col = partyColor(e.metrics.party);
    const w = Math.abs(c.v != null ? c.v : c.hi)/max*100, w2 = c.v != null ? 0 : (Math.abs(c.lo)-Math.abs(c.hi))/max*100;
    const lab = c.v != null ? signed(c.v) : rangeCompact(c.hi,c.lo);
    return `<div class="mb ${e.year===hlYear?'hl':''}"><span class="mby">${e.year}</span><span class="mbt"><i class="${c.v>0?'gain':''}" style="width:${w}%;background:${col};--c:${col}"></i>${w2?`<i class="maybe" style="width:${w2}%;--c:${col}"></i>`:''}</span><span class="mbv">${lab}</span></div>`; }).join('')}${avg ? `<div class="mb mb-avg"><span class="mby">Avg</span><span class="mbt"><i style="width:${Math.abs(avg.all)/max*100}%"></i></span><span class="mbv">${ch==='senate' ? signed(avg.all,1) : signed(Math.round(avg.all))}</span></div>` : ''}</div>`;
}
// One dot per seat won or lost.
function dotRows(list, ch, hlYear){
  return list.map(e => { const c = change(e,ch); if (!c) return '';
    const col = partyColor(e.metrics.party); let dots = '';
    if (c.v != null){ for (let i=0;i<Math.abs(c.v);i++) dots += `<i class="pd ${c.v>0?'gain':''}" style="--c:${col}"></i>`; }
    else { for (let i=0;i<Math.abs(c.hi);i++) dots += `<i class="pd" style="--c:${col}"></i>`; for (let i=Math.abs(c.hi);i<Math.abs(c.lo);i++) dots += `<i class="pd maybe" style="--c:${col}"></i>`; }
    const lab = c.v != null ? signed(c.v) : rangeCompact(c.hi,c.lo);
    return `<div class="drow ${e.year===hlYear?'hl':''}" data-id="${e.id}"><div class="dy"><b>${e.year}</b><span>${esc(lastName(e.metrics.president))}, ${PARTY_PLURAL[e.metrics.party]}</span></div><div class="dd" aria-label="${c.v != null ? lab : rangeText(c.hi,c.lo)} seats">${dots || '<span class="small muted">no change</span>'}</div><div class="dl" style="color:${col}">${lab}</div></div>`; }).join('');
}

// Average seat change for the president's party, every settled midterm (gains included).
function midtermAvg(ch, exclude){
  const v = midterms().filter(e => e !== exclude).map(e => change(e,ch)).filter(c => c && c.v != null).map(c => c.v);
  const losses = v.filter(x => x < 0);
  return {all: mean(v), lossesOnly: mean(losses), n: v.length, lost: losses.length,
    from: Math.min(...midterms().map(e=>e.year)), to: Math.max(...midterms().filter(e => change(e,ch) && change(e,ch).v != null && e !== exclude).map(e=>e.year))};
}

const S = {year:null};
function lossPhrase(c, chamber){
  if (c.v != null) return c.v < 0 ? `lost ${-c.v} ${chamber} seat${c.v===-1?'':'s'}` : c.v > 0 ? `gained ${c.v} ${chamber} seat${c.v===1?'':'s'}` : `broke even in the ${chamber}`;
  return `lost at least ${-c.hi} and possibly ${-c.lo} ${chamber} seats`;
}

  const ref = hc.v != null ? hc.v : hc.hi;  // best case for a provisional year
  const worse = others.filter(e => change(e,'house').v < ref).length;
  const lostCount = others.filter(e => change(e,'house').v < 0).length;
  const avg = mean(others.map(e => change(e,'house').v));
  const low = others.filter(e => e.metrics.approval != null && e.metrics.approval < 50);

    ['ruler','Seats won or lost','How many more or fewer seats the president’s party holds after the election than before it. A minus sign means a loss.'],

/* ---------- Turnout ---------- */
// Midterm turnout as a share of eligible voters (votes for the highest office), U.S. Elections Project series.
const TURNOUT = [[1974,39.1],[1978,39.0],[1982,42.0],[1986,38.1],[1990,38.4],[1994,41.1],[1998,38.1],[2002,39.5],[2006,40.4],[2010,41.0],[2014,36.7],[2018,50.0],[2022,46.2],[2026,49.4,true]];
const TURNOUT_SRC = 'U.S. Elections Project (Michael McDonald) series, as compiled by Mehlman Consulting and the Alliance for Retired Americans. 2026 is a preliminary estimate from the University of Florida Election Lab; early estimates run 48.8% to 49.4%.';
const TO = {base:null, comp:null};

function turnoutRows(e){
  if (!e || !e.results) return [];
  return e.results.rows.map(r => { const t = tally(r.values, e.results.columns); return {unit:r.unit, reg:t.reg, cast:t.cast || t.tot, turnout:t.turnout, dT:t.dTurn, rT:t.rTurn}; }).filter(r => r.turnout != null);
}
function heatColor(v, lo, hi){
  const k = hi > lo ? (v - lo)/(hi - lo) : .5;
  return `color-mix(in srgb, var(--mark) ${Math.round(12 + k*88)}%, var(--surface))`;
}
function turnoutHistorySVG(){
  const W = 640, H = 230, x0 = 34, bw = (W - x0 - 10)/TURNOUT.length, max = 55;
  const y = v => 190 - v/max*170;
  const settled = TURNOUT.filter(t => !t[2]).map(t => t[1]);
  const avg = mean(settled);
  const bars = TURNOUT.map((t,i) => { const [yr, v, prov] = t, x = x0 + i*bw + 4, w = bw - 8, top = y(v);
    const fill = prov ? 'url(#stripe)' : (yr === 2018 ? 'var(--ink)' : 'color-mix(in srgb, var(--ink) 35%, var(--surface))');
    return `<rect x="${x}" y="${top}" width="${w}" height="${190-top}" rx="4" fill="${fill}" ${prov?'stroke="var(--mark)" stroke-width="2"':''}><title>${yr}: ${v}%${prov?' (preliminary)':''}</title></rect>
      ${prov||yr===2018 ? `<text x="${x+w/2}" y="${top-8}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${Math.round(v)}%</text>`
        : `<text x="${x+w/2}" y="${top+18}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">${Math.round(v)}%</text>`}
      <text x="${x+w/2}" y="208" text-anchor="middle" font-size="11" fill="var(--muted)">’${String(yr).slice(2)}</text>`; }).join('');
  return `<svg class="thist" viewBox="0 0 ${W} ${H}" role="img" aria-label="Midterm turnout by year, 1974 to 2026">
    <defs><pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--mark-soft)"/><rect width="4" height="8" fill="var(--mark)"/></pattern></defs>
    <line x1="${x0}" y1="${y(avg)}" x2="${W-6}" y2="${y(avg)}" stroke="var(--rep)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${x0-4}" y="${y(avg)+4}" text-anchor="end" font-size="11" fill="var(--rep)" font-weight="600">avg</text>
    ${bars}
    <line x1="${x0}" y1="190" x2="${W-6}" y2="190" stroke="var(--ink)" stroke-width="1"/>
  </svg>`;
}
function peopleGrid(n){
  let s = ''; for (let i=0;i<100;i++){ const x = (i%20)*16 + 8, yy = Math.floor(i/20)*26 + 8, on = i < Math.round(n);
    s += `<g fill="${on ? 'var(--mark)' : 'var(--rule)'}"><circle cx="${x+5}" cy="${yy+4}" r="4"/><path d="M${x} ${yy+20}q0-11 5-11q5 0 5 11z"/></g>`; }
  return `<svg class="pgrid" viewBox="0 0 330 140" role="img" aria-label="${Math.round(n)} out of 100 eligible people voted">${s}</svg>`;
}

function renderTurnout(){
  const latest = TURNOUT[TURNOUT.length-1], prev = TURNOUT.filter(t => !t[2]);
  const avg = mean(prev.map(t=>t[1])), top = prev.reduce((a,t) => t[1] > a[1] ? t : a);
  const withTurnout = state.elections.filter(e => e.results && e.results.columns.some(c => c.role === 'reg'));
  if (!withTurnout.find(e => e.id === TO.base)) TO.base = withTurnout[0]?.id || null;
  if (TO.comp && (!withTurnout.find(e => e.id === TO.comp) || TO.comp === TO.base)) TO.comp = null;

  $('#app').innerHTML = `
    <section class="bluf">
      <p class="bluf-kicker">Turnout: who showed up</p>
      <h1 class="bluf-head">About ${Math.round(latest[1])}% of eligible Americans voted in ${latest[0]}.</h1>
      <p class="bluf-sub">The second-highest midterm turnout since 1914, just behind 2018. Still, about half of eligible Americans sat it out.</p>
    </section>

    <div class="grid2">
      <section class="panel">
        <div class="card-head">${icon('people')}<h3>Out of every 100 eligible Americans</h3></div>
        <div class="bignum" style="color:var(--mark)">${Math.round(latest[1])} voted<small>in ${latest[0]} (preliminary)</small></div>
        ${peopleGrid(latest[1])}
      </section>
      <section class="panel">
        <div class="card-head">${icon('ruler')}<h3>How it compares</h3></div>
        <div class="bignums">
          <div class="bignum">${latest[1].toFixed(1)}%<small>${latest[0]}, preliminary</small></div>
          <div class="bignum" style="color:var(--muted)">${avg.toFixed(1)}%<small>average midterm, ${prev[0][0]}–${prev[prev.length-1][0]}</small></div>
        </div>
        <p class="say">${latest[0]} ran <b>${(latest[1]-avg).toFixed(1)} points above</b> the average midterm and ${(top[1]-latest[1]).toFixed(1)} points below the record of ${top[1]}% in ${top[0]}.</p>
        ${helpBox('Turnout here means ballots for the top race divided by everyone eligible to vote (citizens 18 and over, minus people barred for a felony in some states). It’s different from turnout of registered voters, which runs higher.')}
      </section>
    </div>

    <section class="panel">
      <div class="card-head">${icon('clock')}<h3>Every midterm since 1974</h3></div>
      <p class="say small">The last three midterms are the three highest in this chart. The dashed red line is the average.</p>
      <div class="tbl-wrap" style="border:0;max-height:none">${turnoutHistorySVG()}</div>
      <p class="small muted">${esc(TURNOUT_SRC)}</p>
    </section>

    <div class="grid3">
      <section class="tcard" style="--c:var(--ok)"><div class="tbody">
        <div class="bignum" style="color:var(--ok)">15%<small>of 2026 voters hadn’t voted in 2024</small></div>
        <p class="say small">They broke for Democrats 59% to 36%. New voters, not switchers, did much of the work.</p>${stamp('strong')}
        <p class="small muted" style="margin-top:8px">NORC survey, via the Washington Post</p></div></section>
      <section class="tcard" style="--c:var(--ok)"><div class="tbody">
        <div class="bignum" style="color:var(--ok)">65.8%<small>Maine, the highest turnout state</small></div>
        <p class="say small">West Virginia was lowest at 33.3%, a gap of more than 30 points between states.</p>${stamp('strong')}
        <p class="small muted" style="margin-top:8px">University of Florida Election Lab, via Al Jazeera</p></div></section>
      <section class="tcard" style="--c:var(--mark)"><div class="tbody">
        <div class="bignum" style="color:var(--mark)">Your turn<small>what happened in Bucks County?</small></div>
        <p class="say small">Load your precinct file below to see which precincts turned out, which jumped, and which party’s voters showed up.</p></div></section>
    </div>
    <div style="height:20px"></div>

    ${precinctTurnoutSection(withTurnout)}`;
  ['toBase','toComp'].forEach(id => { const el = $('#'+id); if (el) el.onchange = () => { TO.base = $('#toBase').value; TO.comp = $('#toComp') ? ($('#toComp').value || null) : null; renderTurnout(); }; });
  const tpl = $('#toTpl'); if (tpl) tpl.onclick = () => download('turnout-template.csv', 'Precinct,Registered voters,Ballots cast,Registered Democrats,Registered Republicans,Democrats who voted,Republicans who voted,Candidate A (D),Candidate B (R)\nExample Township 1,0,0,0,0,0,0,0,0\n', 'text/csv');
}

function precinctTurnoutSection(withTurnout){
  const head = `<div class="card-head">${icon('ballot')}<div><h2 style="margin:0">Your precincts</h2><p class="small muted" style="margin:0">From any election you’ve loaded that has a registered-voters column.</p></div></div>`;
  if (!withTurnout.length) return `<section class="panel">${head}
    <div class="empty-turn">
      <div class="bignum" style="color:var(--muted)">No precinct files yet</div>
      <p class="say">Add an election with these columns, one row per precinct. Only the first three are required; the party columns unlock “who showed up.”</p>
      <div class="sheet"><table><thead><tr><th class="colA">Precinct</th><th class="r">Registered voters</th><th class="r">Ballots cast</th><th class="r">Registered Democrats</th><th class="r">Registered Republicans</th><th class="r">Democrats who voted</th><th class="r">Republicans who voted</th></tr></thead></table></div>
      <div class="actions"><button class="btn ghost" id="toTpl">Download turnout template</button><a class="btn" href="#add" style="text-decoration:none">Add election</a></div>
      <p class="small muted" style="margin-top:10px">Bucks County’s Board of Elections publishes precinct results and voter counts after certification; the voter file shows who voted by party.</p>
    </div></section>`;

  const A = byId(TO.base), rowsA = turnoutRows(A);
  const sA = summarize(A);
  const sorted = rowsA.slice().sort((a,b) => b.turnout - a.turnout);
  const lo = sorted.length ? sorted[sorted.length-1].turnout : 0, hi = sorted.length ? sorted[0].turnout : 1;
  const opt = (id, blank) => (blank ? '<option value="">None</option>' : '') + withTurnout.map(e => `<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)}</option>`).join('');
  const party = rowsA.some(r => r.dT != null && r.rT != null);

  let compare = '';
  if (TO.comp){
    const B = byId(TO.comp), mapB = new Map(turnoutRows(B).map(r => [norm(r.unit), r]));
    const ch = rowsA.map(r => { const b = mapB.get(norm(r.unit)); return b ? {unit:r.unit, a:b.turnout, b:r.turnout, d:r.turnout - b.turnout} : null; }).filter(Boolean).sort((x,y) => y.d - x.d);
    const jumped = ch.filter(r => r.d >= 5);
    const sB = summarize(B);
    compare = `<section class="panel">
      <div class="card-head">${icon('arrows')}<h3>What changed since ${esc(B.name)}</h3></div>
      <div class="bignums">
        <div class="bignum">${signed(sA.turnout - sB.turnout,1)} pts<small>overall turnout change</small></div>
        <div class="bignum" style="color:var(--mark)">${jumped.length}<small>precincts jumped 5+ points</small></div>
        <div class="bignum" style="color:var(--muted)">${ch.length}<small>precincts matched</small></div>
      </div>
      <div class="movers">
        <div class="mover" style="border-top:3px solid var(--mark)"><b>Biggest turnout jumps</b><ol>${ch.filter(r=>r.d>0).slice(0,8).map(r=>`<li><span>${esc(r.unit)}</span><span>${signed(r.d,1)}</span></li>`).join('')}</ol></div>
        <div class="mover" style="border-top:3px solid var(--muted)"><b>Biggest drops</b><ol>${ch.filter(r=>r.d<0).slice(-8).reverse().map(r=>`<li><span>${esc(r.unit)}</span><span>${signed(r.d,1)}</span></li>`).join('')}</ol></div>
      </div>
      ${helpBox('A jump of 5 or more points is flagged because it’s bigger than normal year-to-year wobble. Compare the list with where groups said they organized: if their precincts jumped more than similar ones nearby, that’s real evidence their work mattered.')}
    </section>`;
  }

  return `<section class="panel">${head}
    <div class="controls" style="margin-top:12px">
      <label class="field">Election<select id="toBase">${opt(TO.base)}</select></label>
      <label class="field">Compare with an earlier election<select id="toComp">${opt(TO.comp, true)}</select></label>
    </div>
    <div class="bignums">
      <div class="bignum" style="color:var(--mark)">${pct(sA.turnout)}<small>turnout of registered voters</small></div>
      ${sorted.length ? `<div class="bignum">${pct(hi,0)}<small>hottest: ${esc(sorted[0].unit)}</small></div><div class="bignum" style="color:var(--muted)">${pct(lo,0)}<small>coldest: ${esc(sorted[sorted.length-1].unit)}</small></div>` : ''}
    </div>
    <h3 style="margin-top:8px">Every precinct, hottest to coldest</h3>
    <div class="heat">${sorted.map(r => `<div class="heat-tile" style="background:${heatColor(r.turnout, lo, hi)}" title="${esc(r.unit)}: ${r.turnout.toFixed(1)}%"><b>${Math.round(r.turnout)}</b><span>${esc(r.unit)}</span></div>`).join('')}</div>
    ${party ? `<h3 style="margin-top:20px">Who showed up</h3>
      <div class="bignums"><div class="bignum" style="color:var(--dem)">${pct(sA.dTurn)}<small>of registered Democrats voted</small></div><div class="bignum" style="color:var(--rep)">${pct(sA.rTurn)}<small>of registered Republicans voted</small></div></div>
      <p class="say"><b>${sA.dTurn > sA.rTurn ? 'Democrats' : 'Republicans'}</b> turned out ${Math.abs(sA.dTurn - sA.rTurn).toFixed(1)} points better overall. Precincts with the widest gaps:</p>
      <div class="movers">

        <div class="mover" style="border-top:3px solid var(--rep)"><b>Republicans out-voted Democrats most</b><ol>${rowsA.filter(r=>r.dT!=null && r.rT>r.dT).sort((a,b)=>(a.dT-a.rT)-(b.dT-b.rT)).slice(0,6).map(r=>`<li><span>${esc(r.unit)}</span><span>${signed(r.rT-r.dT,1)}</span></li>`).join('')}</ol></div>

  </section>${compare}`;
}

function renderCompare(){
  compareSel = compareSel.filter(id => byId(id));
  const sel = compareSel.map(byId);
  const pool = state.elections.filter(e => !CMP.q || norm(`${e.name} ${e.jurisdiction} ${e.year} ${e.type}`).includes(norm(CMP.q))).sort((a,b)=>b.year-a.year);
  const withRes = sel.filter(e => e.results);
  if (!withRes.find(e => e.id === CMP.base)) CMP.base = withRes[0]?.id || null;
  if (!withRes.find(e => e.id === CMP.comp) || CMP.comp === CMP.base) CMP.comp = withRes.find(e => e.id !== CMP.base)?.id || null;

  // side-by-side metric rows
  const keys = []; sel.forEach(e => Object.keys(e.metrics||{}).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  const sums = sel.map(summarize);
  const anyRes = sums.some(Boolean);
  const numCell = (val, base, signedKey) => {
    if (val == null || val === '' || !isFinite(+val)) return `<td class="r">${val == null || val === '' ? '—' : esc(val)}</td>`;
    const d = (base != null && base !== '' && isFinite(+base)) ? +val - +base : null;
    return `<td class="r">${signedKey ? signed(+val) : fmt(+val)}${d != null && d !== 0 ? ` <span class="small muted">(${signed(d)})</span>` : ''}</td>`;
  };

  $('#app').innerHTML = `
    <h1>Compare</h1>
    <p class="lede">Choose up to four elections to see them side by side. When two of them have results by precinct, county or district, you also get the swing in each place that appears in both.</p>
    <div class="grid2">
      <section class="panel">
        <h2>Choose elections</h2>
        <label class="field" style="margin:10px 0">Search<input type="search" id="cq" value="${esc(CMP.q)}" placeholder="Name, place, year or type"></label>
        <div class="picker">${pool.map(e => `<label><input type="checkbox" value="${e.id}" ${compareSel.includes(e.id)?'checked':''} ${!compareSel.includes(e.id) && compareSel.length>=4 ? 'disabled':''}> <span>${esc(e.name)} <span class="small muted">${esc(e.jurisdiction)}${e.results?', with results':''}</span></span></label>`).join('') || '<div class="empty">Nothing matches.</div>'}</div>
      </section>
      <section class="panel">
        <h2>Selected</h2>
        ${sel.length ? `<div class="chips">${sel.map(e=>`<span class="chip">${esc(e.name)}</span>`).join('')}</div><p class="small muted">The first election is the baseline: numbers in parentheses show the difference from it.</p><button class="btn ghost" id="cClear">Clear selection</button>`
          : `<div class="empty">Nothing selected yet. Try 2018, 2022 and 2026 to compare the last three midterms.</div>`}
      </section>
    </div>
    ${sel.length ? `<section class="panel"><h2>Side by side</h2><div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Measure</th>${sel.map(e=>`<th class="r">${esc(e.name)}</th>`).join('')}</tr></thead><tbody>
      ${keys.map(k => `<tr><td>${esc(LABELS[k]||k)}</td>${sel.map(e => numCell(e.metrics?.[k], sel[0].metrics?.[k], SIGNED_KEYS.has(k))).join('')}</tr>`).join('')}
      ${anyRes ? [['tot','Votes cast'],['dTwo','Democratic share, two-party (%)'],['margin','Margin, D minus R (pts)'],['turnout','Turnout (%)'],['units','Reporting units']].map(([k,l]) =>
        `<tr><td>${l}</td>${sums.map(s => { if (!s || s[k]==null) return '<td class="r">—</td>'; const b = sums[0]?.[k]; const v = s[k]; const d = (b!=null && s!==sums[0]) ? v-b : null;
          const show = (k==='tot'||k==='units') ? fmt(v) : (k==='margin' ? signed(v,1) : v.toFixed(1));
          return `<td class="r">${show}${d!=null && Math.abs(d)>1e-9 ? ` <span class="small muted">(${k==='tot'||k==='units' ? signed(d) : signed(d,1)})</span>`:''}</td>`; }).join('')}</tr>`).join('') : ''}
    </tbody></table></div></section>` : ''}
